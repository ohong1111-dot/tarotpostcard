<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>偉特地景・載具校準與即時視覺調校盤</title>
  <style>
    :root {
      --bg-color: #171615;
      --card-bg: #23211f;
      --text-main: #f5f2eb;
      --accent-gold: #c5a059;
      --border-color: #3d3a36;
      --cinnabar-red: #8a3324;
      --text-muted: #a8a29e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 16px 60px;
    }

    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 1.55rem; color: var(--accent-gold); letter-spacing: 0.15em; }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 860px;
    }

    /* 橫版古典明信片 3:2 容器 */
    .canvas-wrapper {
      background-color: #fdf9f0;
      border-radius: 4px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 2;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* 即時視覺調校工作台 */
    .tuner-panel {
      width: 100%;
      background: #1f1d1a;
      border: 1px solid var(--accent-gold);
      padding: 16px 20px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tuner-panel h3 {
      font-size: 1rem;
      color: var(--accent-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tuner-selectors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .tuner-selectors select {
      background: #121110;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 7px 10px;
      font-size: 0.85rem;
      border-radius: 2px;
      outline: none;
    }

    .sliders-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 20px;
      background: rgba(0,0,0,0.25);
      padding: 12px;
      border-radius: 3px;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-item label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .slider-item label span {
      color: var(--accent-gold);
      font-family: monospace;
    }

    .slider-item input[type="range"] {
      width: 100%;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .code-export {
      background: #121110;
      border: 1px dashed #444;
      padding: 10px;
      font-size: 0.78rem;
      color: #9cdcfe;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <h1>偉特地景・即時視覺調校盤</h1>
  </header>

  <div class="main-container">
    <div class="canvas-wrapper">
      <canvas id="postcardCanvas" width="1200" height="800"></canvas>
    </div>

    <!-- 視覺除錯調校盤 -->
    <div class="tuner-panel">
      <h3>
        <span>即時預覽與比例調校</span>
        <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">拖曳滑桿即時渲染，不用每次推 code！</span>
      </h3>

      <div class="tuner-selectors">
        <div>
          <label style="font-size: 0.75rem; color:#888;">天空 (Sky)</label>
          <select id="tuneSky" onchange="liveRender()">
            <option value="sky_sunset">落日餘暉 (sunset)</option>
            <option value="sky_gold">暮日晨光 (gold)</option>
            <option value="sky_night">深藍子夜 (night)</option>
            <option value="sky_storm">風暴前夕 (storm)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">地貌 (Ground)</label>
          <select id="tuneGround" onchange="liveRender()">
            <option value="ground_hill">蒼茫起伏山丘 (hill)</option>
            <option value="ground_cliff">荒蕪峭壁 (cliff)</option>
            <option value="ground_terrace">石階高台 (terrace)</option>
            <option value="ground_water">幽暗水岸 (water)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">生路出口 (Exit)</label>
          <select id="tuneExit" onchange="liveRender()">
            <option value="exit_sea">汪洋出海口 (sea)</option>
            <option value="exit_bridge">跨谷木橋 (bridge)</option>
            <option value="exit_arch">雙塔石門 (arch)</option>
            <option value="exit_path">林間小徑 (path)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">旅人姿態 (Figure)</label>
          <select id="tuneFigure" onchange="liveRender()">
            <option value="figure_guard">持杖防禦 (guard)</option>
            <option value="figure_walk">啟程涉足 (walk)</option>
            <option value="figure_stand">佇立凝視 (stand)</option>
            <option value="figure_sit">盤坐靜觀 (sit)</option>
          </select>
        </div>
      </div>

      <div class="sliders-grid">
        <div class="slider-item">
          <label>出口水平 X 位置 <span id="valExitX">0.66</span></label>
          <input type="range" id="tuneExitX" min="0.4" max="0.85" step="0.01" value="0.66" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>出口垂直 Y 位置 (貼地度) <span id="valExitY">0.92</span></label>
          <input type="range" id="tuneExitY" min="0.5" max="1.0" step="0.01" value="0.92" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>出口縮放寬度 (Size) <span id="valExitW">0.34</span></label>
          <input type="range" id="tuneExitW" min="0.15" max="0.55" step="0.01" value="0.34" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>地貌高度 (Ground Sink) <span id="valGroundH">0.52</span></label>
          <input type="range" id="tuneGroundH" min="0.3" max="0.8" step="0.01" value="0.52" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>人物水平 X 位置 <span id="valFigX">0.08</span></label>
          <input type="range" id="tuneFigX" min="0.02" max="0.3" step="0.01" value="0.08" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>人物大小 (Size) <span id="valFigH">0.38</span></label>
          <input type="range" id="tuneFigH" min="0.2" max="0.6" step="0.01" value="0.38" oninput="liveRender()">
        </div>
      </div>

      <div>
        <label style="font-size: 0.75rem; color:#888;">當前最佳參數紀錄（調好滿意後複製）：</label>
        <div class="code-export" id="codeExport"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('postcardCanvas');
    const ctx = canvas.getContext('2d');

    const cache = {};
    function loadImage(src) {
      if (cache[src]) return Promise.resolve(cache[src]);
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = src;
        img.onload = () => { cache[src] = img; resolve(img); };
        img.onerror = () => resolve(null);
      });
    }

    function createTransparentCanvas(img) {
      if (!img) return null;
      const off = document.createElement('canvas');
      off.width = img.naturalWidth || img.width;
      off.height = img.naturalHeight || img.height;
      const oCtx = off.getContext('2d');
      oCtx.drawImage(img, 0, 0);
      try {
        const imgData = oCtx.getImageData(0, 0, off.width, off.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] > 220 && d[i+1] > 220 && d[i+2] > 220) d[i+3] = 0;
        }
        oCtx.putImageData(imgData, 0, 0);
        return off;
      } catch(e) { return img; }
    }

    async function liveRender() {
      // 讀取當前控制台參數
      const sky = document.getElementById('tuneSky').value;
      const ground = document.getElementById('tuneGround').value;
      const exit = document.getElementById('tuneExit').value;
      const fig = document.getElementById('tuneFigure').value;

      const exitXRatio = parseFloat(document.getElementById('tuneExitX').value);
      const exitYRatio = parseFloat(document.getElementById('tuneExitY').value);
      const exitWRatio = parseFloat(document.getElementById('tuneExitW').value);
      const groundHRatio = parseFloat(document.getElementById('tuneGroundH').value);
      const figXRatio = parseFloat(document.getElementById('tuneFigX').value);
      const figHRatio = parseFloat(document.getElementById('tuneFigH').value);

      // 更新數字顯示
      document.getElementById('valExitX').innerText = exitXRatio.toFixed(2);
      document.getElementById('valExitY').innerText = exitYRatio.toFixed(2);
      document.getElementById('valExitW').innerText = exitWRatio.toFixed(2);
      document.getElementById('valGroundH').innerText = groundHRatio.toFixed(2);
      document.getElementById('valFigX').innerText = figXRatio.toFixed(2);
      document.getElementById('valFigH').innerText = figHRatio.toFixed(2);

      document.getElementById('codeExport').innerText = 
        `Exit: X=${exitXRatio.toFixed(2)}, Y=${exitYRatio.toFixed(2)}, W=${exitWRatio.toFixed(2)} | GroundH=${groundHRatio.toFixed(2)} | Fig: X=${figXRatio.toFixed(2)}, H=${figHRatio.toFixed(2)}`;

      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const [rawSky, rawGround, rawExit, rawFigure] = await Promise.all([
        loadImage(`assets/skies/${sky}.png`),
        loadImage(`assets/grounds/${ground}.png`),
        loadImage(`assets/exits/${exit}.png`),
        loadImage(`assets/figures/${fig}.png`)
      ]);

      const imgSky = rawSky;
      const imgGround = createTransparentCanvas(rawGround);
      const imgExit = createTransparentCanvas(rawExit);
      const imgFigure = createTransparentCanvas(rawFigure);

      // 底紙
      ctx.fillStyle = "#fdf9f0";
      ctx.fillRect(0, 0, W, H);

      const margin = 32;
      const innerW = W - margin * 2;
      const innerH = H - margin * 2 - 36;

      ctx.save();
      ctx.beginPath();
      ctx.rect(margin, margin, innerW, innerH);
      ctx.clip();

      // 1. 天空
      if (imgSky) ctx.drawImage(imgSky, margin, margin, innerW, innerH);

      // 2. 地貌
      if (imgGround) {
        const gH = innerH * groundHRatio;
        const gY = margin + innerH - gH;
        ctx.drawImage(imgGround, margin, gY, innerW, gH);
      }

      // 3. 出口
      if (imgExit) {
        const exitAspect = (imgExit.width / imgExit.height) || 1.2;
        const exitW = innerW * exitWRatio;
        const exitH = exitW / exitAspect;
        const exitX = margin + (innerW * exitXRatio);
        const exitY = margin + (innerH * exitYRatio) - exitH;

        ctx.globalAlpha = 0.96;
        ctx.drawImage(imgExit, exitX, exitY, exitW, exitH);
        ctx.globalAlpha = 1.0;
      }

      // 4. 人物
      if (imgFigure) {
        const figH = innerH * figHRatio;
        const figAspect = (imgFigure.width / imgFigure.height) || 0.6;
        const figW = figH * figAspect;
        const figX = margin + (innerW * figXRatio);
        const figY = margin + (innerH * 0.90) - figH;
        ctx.drawImage(imgFigure, figX, figY, figW, figH);
      }

      ctx.restore();

      // 雙框線
      ctx.strokeStyle = "#2b261f";
      ctx.lineWidth = 3;
      ctx.strokeRect(margin, margin, innerW, innerH);
      ctx.lineWidth = 1;
      ctx.strokeRect(margin - 6, margin - 6, innerW + 12, innerH + 12);
    }

    // 啟動時立即渲染
    window.onload = () => { liveRender(); };
  </script>
</body>
</html>
