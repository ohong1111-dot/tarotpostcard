<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>偉特地景・心靈載具校準系統</title>
  <style>
    :root {
      --bg-color: #1a1918;
      --card-bg: #242220;
      --text-main: #f5f2eb;
      --accent-gold: #c5a059;
      --border-color: #3d3a36;
      --cinnabar-red: #8a3324;
      --text-muted: #a8a29e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: var(--accent-gold);
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 760px;
    }

    /* 橫版古典明信片 3:2 容器 */
    .canvas-wrapper {
      background-color: #fdf9f0;
      border-radius: 4px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 2;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 12px;
    }

    button {
      padding: 13px 20px;
      font-size: 0.95rem;
      border: 1px solid var(--accent-gold);
      background: transparent;
      color: var(--accent-gold);
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-gold);
      color: #1a1918;
    }

    button.btn-primary {
      background: var(--cinnabar-red);
      border-color: var(--cinnabar-red);
      color: #fff;
    }

    button.btn-primary:hover {
      background: #a33e2c;
      border-color: #a33e2c;
    }

    button.btn-pay {
      background: #2b261f;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-weight: 500;
    }

    button.btn-pay:hover {
      background: var(--accent-gold);
      color: #1a1918;
    }

    /* 300字出廠手冊區塊 */
    .card-info {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 4px;
      width: 100%;
      display: none;
    }

    .hd-badge {
      display: inline-block;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 3px 10px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .card-info h2 {
      font-size: 1.2rem;
      color: var(--accent-gold);
      margin-bottom: 14px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .manual-content {
      font-size: 0.92rem;
      line-height: 1.85;
      color: #d6d3cd;
      margin-bottom: 24px;
      text-align: justify;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    /* 付費買斷與信物解鎖區塊 */
    .payment-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(0, 0, 0, 0.25);
      padding: 18px;
      border-radius: 4px;
      border: 1px dashed #4a453e;
    }

    .invoice-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .invoice-opt input {
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .invoice-input-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .invoice-input-box input {
      background: #1a1918;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      font-size: 0.85rem;
      border-radius: 2px;
      outline: none;
    }

    .invoice-input-box input:focus {
      border-color: var(--accent-gold);
    }

    .unlocked-tool-card {
      display: none;
      background: #1e1d1b;
      border: 1px solid var(--accent-gold);
      padding: 16px;
      border-radius: 4px;
      margin-top: 10px;
      align-items: center;
      gap: 16px;
    }

    .unlocked-tool-card img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      background: #fdf9f0;
      padding: 4px;
      border-radius: 2px;
    }

    .tool-desc h4 {
      color: var(--accent-gold);
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .tool-desc p {
      font-size: 0.84rem;
      color: #bbb;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>偉特地景・載具校準</h1>
    <p class="subtitle">1909 偉特木刻原畫 × 人類圖決策原型</p>
  </header>

  <div class="main-container">
    <div class="canvas-wrapper">
      <canvas id="postcardCanvas" width="1200" height="800"></canvas>
    </div>

    <div class="controls">
      <button class="btn-primary" id="btnDraw" onclick="drawCard()">靜心抽牌・顯影當下風景</button>
    </div>

    <div class="card-info" id="cardInfo">
      <span class="hd-badge" id="hdBadge">人類圖原型規格</span>
      <h2 id="infoTitle">載具出廠定位</h2>
      
      <div class="manual-content" id="manualText"></div>

      <div class="payment-section">
        <label class="invoice-opt">
          <input type="checkbox" id="chkInvoice" onchange="toggleInvoice()">
          需要實體手開發票代管存證（免填統編則開立個人收據存證）
        </label>
        
        <div class="invoice-input-box" id="invoiceInputs">
          <input type="text" id="invTitle" placeholder="買受人抬頭 / 姓名">
          <input type="text" id="invTaxId" placeholder="統一編號（個人免填）">
          <input type="email" id="invEmail" placeholder="存證憑據寄送 Email">
        </div>

        <button class="btn-pay" id="btnPay" onclick="handlePayment()">
          NT$ 88 微付費買斷・解鎖高解析原印明信片與專屬隨身信物
        </button>

        <div class="unlocked-tool-card" id="toolCard">
          <img id="toolImg" src="" alt="專屬法器">
          <div class="tool-desc">
            <h4 id="toolTitle">專屬隨身法器信物</h4>
            <p id="toolDetail"></p>
          </div>
        </div>

        <button id="btnDownload" style="display: none; margin-top: 10px;" onclick="downloadPostcard()">
          下載專屬高解析木刻明信片 (PNG)
        </button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('postcardCanvas');
    const ctx = canvas.getContext('2d');

    const ASSET_CONFIG = {
      skies: {
        sky_gold: { name: "暮日晨光", tone: "#f5d77f", hdState: "薦骨動能飽滿 / 處於清晰回應週期" },
        sky_grey: { name: "冷冽長空", tone: "#cfd6df", hdState: "頭腦中心空白 / 外在資訊雜音過載" },
        sky_night: { name: "深藍子夜", tone: "#1e293b", hdState: "直覺中心未定義 / 需停步校準安全邊界" },
        sky_storm: { name: "風暴前夕", tone: "#94a3b8", hdState: "情緒中心週期波動 / 切忌在浪潮頂點做決定" }
      },
      exits: {
        exit_arch: { name: "雙塔石門", guide: "需等待正式邀請或明晰訊號方可穿越" },
        exit_bridge: { name: "跨谷木橋", guide: "依靠薦骨單次反應前進，勿向過去回望" },
        exit_gate: { name: "城邦閘口", guide: "建立明確的物理邊界，停止為他人非自己承擔責任" },
        exit_path: { name: "林間小徑", guide: "跟隨身體微小牽引，放慢步伐讓路徑自現" }
      },
      grounds: {
        ground_cliff: { name: "荒蕪峭壁", baseTone: "#9e9484", env: "高地懸空，考驗對真實地心引力的信任" },
        ground_desert: { name: "蒼茫荒漠", baseTone: "#c2ab7c", env: "資源單一化，正是關閉干擾、專注核心出廠設定之時" },
        ground_ruin: { name: "殘垣基底", baseTone: "#8b8377", env: "舊有防禦機制已碎裂，不必急於重建，席地安坐即可" },
        ground_water: { name: "幽暗水岸", baseTone: "#4b6068", env: "情緒水流暗湧，唯有讓體感沉澱方能辨別方向" }
      },
      figures: {
        figure_guard: { name: "持杖防禦", posture: "防線堅固但過度消耗，請確認是在守護能量還是恐懼未知" },
        figure_sit: { name: "盤坐靜觀", posture: "切斷無效主動出擊，將注意力完全收回體內核心" },
        figure_stand: { name: "佇立凝視", posture: "載具就位，目光清明，凝望遠方出路" },
        figure_walk: { name: "啟程涉足", posture: "動能已被喚醒，請以單步為單位確認身體的真實興奮感" }
      },
      tools: {
        tool_cup: { name: "盈滿聖杯", attr: "滋養感受與直覺流動", guide: "在複雜情境中保留心靈的純淨感知，不被現實功利淘洗。" },
        tool_pentacle: { name: "地靈星幣", attr: "物質顯化與肉身扎根", guide: "把抽象意念落地為實質產物，專注每一分資源的精確調度。" },
        tool_sword: { name: "破局寶劍", attr: "心智清明與邊界決斷", guide: "斬斷拖泥帶水的無效關係，以理性之刃劃出神聖不可侵犯的界線。" },
        tool_wand: { name: "權杖生機", attr: "意志萌芽與創造動能", guide: "點燃內在原始的行動渴望，只要興奮感在，方向自會明朗。" }
      }
    };

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = src;

        if (img.complete) return resolve(img);

        img.onload = () => {
          if ('decode' in img) {
            img.decode().then(() => resolve(img)).catch(() => resolve(img));
          } else {
            resolve(img);
          }
        };

        img.onerror = () => {
          console.warn("未找到圖檔：", src);
          resolve(null);
        };
      });
    }

    // 智能像素過濾：徹底清除 Canva 匯出圖檔的白底框 (RGB > 230 轉透明)
    function createTransparentCanvas(img) {
      if (!img) return null;
      const offCanvas = document.createElement('canvas');
      offCanvas.width = img.naturalWidth || img.width;
      offCanvas.height = img.naturalHeight || img.height;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(img, 0, 0);

      try {
        const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i] > 230 && data[i + 1] > 230 && data[i + 2] > 230) {
            data[i + 3] = 0;
          }
        }
        offCtx.putImageData(imgData, 0, 0);
        return offCanvas;
      } catch (e) {
        return img;
      }
    }

    let currentDrawData = null;

    async function drawCard() {
      const btn = document.getElementById('btnDraw');
      btn.disabled = true;
      btn.innerText = "感應地景中...";

      const pickRandom = (obj) => {
        const keys = Object.keys(obj);
        return keys[Math.floor(Math.random() * keys.length)];
      };

      currentDrawData = {
        sky: pickRandom(ASSET_CONFIG.skies),
        exit: pickRandom(ASSET_CONFIG.exits),
        ground: pickRandom(ASSET_CONFIG.grounds),
        figure: pickRandom(ASSET_CONFIG.figures),
        tool: pickRandom(ASSET_CONFIG.tools),
        timestamp: new Date().toISOString()
      };

      await renderLandscape(currentDrawData);
      updateInfoCard(currentDrawData);

      btn.disabled = false;
      btn.innerText = "重新抽牌・校準地景";
    }

    async function renderLandscape(data) {
      const W = canvas.width;  // 1200
      const H = canvas.height; // 800

      ctx.clearRect(0, 0, W, H);

      // 風景層平行載入（道具不進畫布，轉移至解鎖專區）
      const [rawSky, rawExit, rawGround, rawFigure] = await Promise.all([
        loadImage(`assets/skies/${data.sky}.png`),
        loadImage(`assets/exits/${data.exit}.png`),
        loadImage(`assets/grounds/${data.ground}.png`),
        loadImage(`assets/figures/${data.figure}.png`)
      ]);

      const imgSky = rawSky;
      const imgExit = createTransparentCanvas(rawExit);
      const imgGround = rawGround;
      const imgFigure = createTransparentCanvas(rawFigure);

      // 1. 底紙羊皮紙基底與留白邊界
      ctx.fillStyle = "#fdf9f0";
      ctx.fillRect(0, 0, W, H);

      const margin = 32;
      const innerW = W - margin * 2;
      const innerH = H - margin * 2 - 36;

      ctx.save();
      ctx.beginPath();
      ctx.rect(margin, margin, innerW, innerH);
      ctx.clip(); // 內框裁切遮罩

      // 2. 遠景：天空底色（滿版鋪底）
      ctx.globalCompositeOperation = 'source-over';
      if (imgSky) {
        ctx.drawImage(imgSky, margin, margin, innerW, innerH);
      } else {
        const skyGrad = ctx.createLinearGradient(0, margin, 0, margin + innerH * 0.7);
        skyGrad.addColorStop(0, ASSET_CONFIG.skies[data.sky].tone);
        skyGrad.addColorStop(1, "#fcf6e8");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(margin, margin, innerW, innerH);
      }

      // 3. 遠方生路出口（微縮遠景，座落右側遠方地平線，創造深遠空間感）
      if (imgExit) {
        ctx.save();
        ctx.globalAlpha = 0.82;
        ctx.globalCompositeOperation = 'multiply';
        const exitW = innerW * 0.28;
        const exitH = innerH * 0.48;
        const exitX = margin + innerW - exitW - (innerW * 0.06);
        const exitY = margin + (innerH * 0.26);
        ctx.drawImage(imgExit, exitX, exitY, exitW, exitH);
        ctx.restore();
      }

      // 4. 中景至近景：立足地貌（強制接地，消除漂浮島問題）
      const groundInfo = ASSET_CONFIG.grounds[data.ground];
      const groundH = innerH * 0.54; // 地貌固定佔下半部 54%
      const groundTopY = margin + innerH - groundH;

      // 4-1. 大地沉積底層漸層（避免圖檔未滿版時產生空白斷層）
      ctx.save();
      const baseGrad = ctx.createLinearGradient(0, groundTopY, 0, margin + innerH);
      baseGrad.addColorStop(0, "rgba(235, 226, 208, 0)");
      baseGrad.addColorStop(0.35, "rgba(210, 198, 175, 0.6)");
      baseGrad.addColorStop(1, groundInfo.baseTone);
      ctx.fillStyle = baseGrad;
      ctx.fillRect(margin, groundTopY, innerW, groundH);
      ctx.restore();

      // 4-2. 繪製地貌圖層（長漸層羽化融入天空）
      if (imgGround) {
        const gCanvas = document.createElement('canvas');
        gCanvas.width = innerW;
        gCanvas.height = groundH;
        const gCtx = gCanvas.getContext('2d');

        gCtx.drawImage(imgGround, 0, 0, innerW, groundH);

        // 頂端 40% 平滑羽化過渡
        gCtx.globalCompositeOperation = 'destination-in';
        const fadeGrad = gCtx.createLinearGradient(0, 0, 0, groundH * 0.40);
        fadeGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        fadeGrad.addColorStop(1, 'rgba(0, 0, 0, 1)');
        gCtx.fillStyle = fadeGrad;
        gCtx.fillRect(0, 0, innerW, groundH);

        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(gCanvas, margin, groundTopY, innerW, groundH);
        ctx.restore();
      }

      // 5. 主角：旅人剪影（固定在左側 16%，雙腳踩實近景地面）
      const figH = innerH * 0.36;
      const figW = figH * 0.68;
      const figX = margin + (innerW * 0.16);
      // 腳跟精準切齊畫框下緣，不再漂浮半空
      const figY = margin + innerH - figH - 14;

      ctx.save();
      if (imgFigure) {
        // 第一層：挖空下方地紋，消除穿透
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(imgFigure, figX, figY, figW, figH);
        ctx.restore();

        // 第二層：清晰木刻黑墨壓印
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(imgFigure, figX, figY, figW, figH);
        ctx.restore();
      }
      ctx.restore();

      ctx.restore(); // 結束內部裁切

      // 6. 1909 偉特古典雙層框線
      ctx.strokeStyle = "#2b261f";
      ctx.lineWidth = 3;
      ctx.strokeRect(margin, margin, innerW, innerH);

      ctx.lineWidth = 1;
      ctx.strokeRect(margin - 6, margin - 6, innerW + 12, innerH + 12);

      // 7. 底部情境銘刻文字
      ctx.fillStyle = "#3e382f";
      ctx.font = "italic 20px 'Times New Roman', serif";
      ctx.textAlign = "center";
      const sceneTitle = `${ASSET_CONFIG.grounds[data.ground].name} · ${ASSET_CONFIG.skies[data.sky].name}`;
      ctx.fillText(`— ${sceneTitle} —`, W / 2, H - 18);
    }

    function updateInfoCard(data) {
      const card = document.getElementById('cardInfo');
      const badge = document.getElementById('hdBadge');
      const title = document.getElementById('infoTitle');
      const text = document.getElementById('manualText');

      const sky = ASSET_CONFIG.skies[data.sky];
      const ground = ASSET_CONFIG.grounds[data.ground];
      const exit = ASSET_CONFIG.exits[data.exit];
      const fig = ASSET_CONFIG.figures[data.figure];
      const tool = ASSET_CONFIG.tools[data.tool];

      badge.innerText = `載具出廠校準：${sky.hdState.split('/')[0].trim()}`;
      title.innerText = `地景定位：${ground.name} × ${sky.name}`;

      text.innerHTML = `
        <strong>【空間定位與天候狀態】</strong><br>
        你正置身於「${ground.name}」，天候映照出「${sky.name}」。${ground.env}。此時載具的運作狀態為：${sky.hdState}。外在環境的壓力並非針對你個人，而是當前場域既有的物理規律，無須動用頭腦過度賦予恐慌意義。<br><br>
        <strong>【姿態校準與遠方生路】</strong><br>
        你的載具目前安立於左方近景，呈現「${fig.name}」的模式：${fig.posture}。請凝望右側地平線遠方顯現的「${exit.name}」——這代表此時此地唯一的生路出口：${exit.guide}。由近處立足點望向遠方，無須焦躁疾行，路徑自會由身體動能帶領展開。<br><br>
        <strong>【隱藏隨身信物】</strong><br>
        你此行配備的核心信物為「${tool.name}」（${tool.attr}）。此信物已收斂至你的載具核心，完成解鎖後可獲取完整法器圖譜與邊界使用指引。
      `;

      // 狀態重設
      document.getElementById('toolCard').style.display = "none";
      document.getElementById('btnPay').style.display = "block";
      document.getElementById('btnDownload').style.display = "none";

      card.style.display = "block";
    }

    function toggleInvoice() {
      const chk = document.getElementById('chkInvoice');
      const inputs = document.getElementById('invoiceInputs');
      inputs.style.display = chk.checked ? "flex" : "none";
    }

    function handlePayment() {
      const chk = document.getElementById('chkInvoice').checked;
      let invoiceMsg = "開立個人存證代管收據";

      if (chk) {
        const title = document.getElementById('invTitle').value.trim();
        const taxId = document.getElementById('invTaxId').value.trim();
        const email = document.getElementById('invEmail').value.trim();
        invoiceMsg = `手開發票存證：抬頭「${title || '個人'}」，統編「${taxId || '無'}」，寄送「${email || '未填寫'}」`;
      }

      alert(`【微付費買斷確認】\n金額：NT$ 88\n發票代管：${invoiceMsg}\n\n已成功解鎖高解析原印明信片與專屬信物卡！`);

      const tool = ASSET_CONFIG.tools[currentDrawData.tool];
      document.getElementById('toolImg').src = `assets/tools/${currentDrawData.tool}.png`;
      document.getElementById('toolTitle').innerText = `解鎖隨身法器：${tool.name}`;
      document.getElementById('toolDetail').innerHTML = `<strong>【核心屬性】</strong>${tool.attr}<br><strong>【出廠使用法則】</strong>${tool.guide}`;

      document.getElementById('toolCard').style.display = "flex";
      document.getElementById('btnPay').style.display = "none";
      document.getElementById('btnDownload').style.display = "block";
    }

    function downloadPostcard() {
      const link = document.createElement('a');
      link.download = `Tarot_Landscape_Wide_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
