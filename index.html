<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>塔羅地景・心靈載具明信片</title>
  <style>
    :root {
      --bg-color: #1a1918;
      --card-bg: #262422;
      --text-main: #f5f2eb;
      --accent-gold: #c5a059;
      --border-color: #3d3a36;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.88rem;
      color: #a8a29e;
      letter-spacing: 0.05em;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 480px;
    }

    /* 畫布容器：維持古典明信片 2:3 豎版比例 */
    .canvas-wrapper {
      background-color: #fdf9f0;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 2 / 3;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 380px;
      gap: 12px;
    }

    button {
      padding: 12px 20px;
      font-size: 0.95rem;
      border: 1px solid var(--accent-gold);
      background: transparent;
      color: var(--accent-gold);
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-gold);
      color: #1a1918;
    }

    button.btn-primary {
      background: #8a3324;
      border-color: #8a3324;
      color: #fff;
    }

    button.btn-primary:hover {
      background: #a33e2c;
      border-color: #a33e2c;
    }

    .card-info {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 4px;
      width: 100%;
      max-width: 380px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #d6d3cd;
      display: none;
    }

    .card-info h3 {
      color: var(--accent-gold);
      font-size: 1rem;
      margin-bottom: 6px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <h1>偉特地景・載具校準</h1>
    <p class="subtitle">顯影當下心理景深與立足狀態</p>
  </header>

  <div class="main-container">
    <div class="canvas-wrapper">
      <!-- 畫布設定為 800 x 1200 高解析度輸出 -->
      <canvas id="postcardCanvas" width="800" height="1200"></canvas>
    </div>

    <div class="controls">
      <button class="btn-primary" id="btnDraw" onclick="drawCard()">靜心抽牌・顯影當下風景</button>
      <button id="btnDownload" style="display: none;" onclick="downloadPostcard()">下載專屬木刻明信片 (PNG)</button>
    </div>

    <div class="card-info" id="cardInfo">
      <h3 id="infoTitle">地景分析</h3>
      <p id="infoDesc"></p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('postcardCanvas');
    const ctx = canvas.getContext('2d');

    // 模組化圖檔規格與對應設定
    const ASSET_CONFIG = {
      skies: {
        sky_gold: { name: "暮日晨光", tone: "#f5d77f" },
        sky_grey: { name: "冷冽長空", tone: "#cfd6df" },
        sky_night: { name: "深藍子夜", tone: "#1e293b" },
        sky_storm: { name: "風暴前夕", tone: "#94a3b8" }
      },
      exits: {
        exit_arch: { name: "雙塔石門" },
        exit_bridge: { name: "跨谷木橋" },
        exit_gate: { name: "城邦閘口" },
        exit_path: { name: "林間小徑" }
      },
      grounds: {
        ground_cliff: { name: "荒蕪峭壁", yOffset: 860 },
        ground_desert: { name: "蒼茫荒漠", yOffset: 890 },
        ground_ruin: { name: "殘垣基底", yOffset: 870 },
        ground_water: { name: "幽暗水岸", yOffset: 910 }
      },
      figures: {
        figure_guard: { name: "持杖防禦" },
        figure_sit: { name: "盤坐靜觀" },
        figure_stand: { name: "佇立凝視" },
        figure_walk: { name: "啟程涉足" }
      },
      tools: {
        tool_cup: { name: "盈滿聖杯" },
        tool_pentacle: { name: "地靈星幣" },
        tool_sword: { name: "破局寶劍" },
        tool_wand: { name: "權杖生機" }
      }
    };

    // 圖片異步載入與解碼器
    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = src;

        if (img.complete) {
          return resolve(img);
        }

        img.onload = () => {
          if ('decode' in img) {
            img.decode().then(() => resolve(img)).catch(() => resolve(img));
          } else {
            resolve(img);
          }
        };

        img.onerror = () => {
          console.warn("未找到圖檔，將採用結構化備用色塊：", src);
          resolve(null);
        };
      });
    }

    // 抽牌核心控制器
    async function drawCard() {
      const btn = document.getElementById('btnDraw');
      btn.disabled = true;
      btn.innerText = "感應地景中...";

      const pickRandom = (obj) => {
        const keys = Object.keys(obj);
        return keys[Math.floor(Math.random() * keys.length)];
      };

      const selected = {
        sky: pickRandom(ASSET_CONFIG.skies),
        exit: pickRandom(ASSET_CONFIG.exits),
        ground: pickRandom(ASSET_CONFIG.grounds),
        figure: pickRandom(ASSET_CONFIG.figures),
        tool: pickRandom(ASSET_CONFIG.tools),
        isMirrored: Math.random() > 0.5,
        timestamp: new Date().toISOString()
      };

      await renderLandscape(selected);
      updateInfoCard(selected);

      btn.disabled = false;
      btn.innerText = "重新抽牌・校準地景";
    }

    // Canvas 五層結構化繪製
    async function renderLandscape(data) {
      const W = canvas.width;
      const H = canvas.height;

      ctx.clearRect(0, 0, W, H);

      const [imgSky, imgExit, imgGround, imgFigure, imgTool] = await Promise.all([
        loadImage(`assets/skies/${data.sky}.png`),
        loadImage(`assets/exits/${data.exit}.png`),
        loadImage(`assets/grounds/${data.ground}.png`),
        loadImage(`assets/figures/${data.figure}.png`),
        loadImage(`assets/tools/${data.tool}.png`)
      ]);

      // 1. 底紙羊皮紙基底與邊界留白
      ctx.fillStyle = "#fdf9f0";
      ctx.fillRect(0, 0, W, H);

      const margin = 36;
      const innerW = W - margin * 2;
      const innerH = H - margin * 2 - 40; // 底部留出題字空間

      ctx.save();
      ctx.beginPath();
      ctx.rect(margin, margin, innerW, innerH);
      ctx.clip(); // 建立裁切遮罩，防止圖層溢出邊框

      // 2. 遠景：天空底色（維持明亮通透）
      ctx.globalCompositeOperation = 'source-over';
      if (imgSky) {
        ctx.drawImage(imgSky, margin, margin, innerW, innerH);
      } else {
        const skyGrad = ctx.createLinearGradient(0, margin, 0, innerH * 0.75);
        skyGrad.addColorStop(0, ASSET_CONFIG.skies[data.sky].tone);
        skyGrad.addColorStop(1, "#fcf6e8");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(margin, margin, innerW, innerH);
      }

      // 3. 遠景：生路出口（空氣透視感）
      if (imgExit) {
        ctx.save();
        ctx.globalAlpha = 0.85; // 遠景淡出
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(imgExit, margin, margin, innerW, innerH);
        ctx.restore();
      }

      // 4. 中景：立足地貌（穩固重心）
      if (imgGround) {
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(imgGround, margin, margin, innerW, innerH);
        ctx.restore();
      }

      // 5. 主角：旅人剪影（具備實體遮蔽，背景線條不穿透身體）
      const groundInfo = ASSET_CONFIG.grounds[data.ground];
      const figW = innerW * 0.35;
      const figH = figW * 1.45;
      const figX = margin + innerW * 0.32;
      const figY = margin + (groundInfo.yOffset / 1200 * innerH) - figH + 18;

      ctx.save();
      if (data.isMirrored) {
        ctx.translate(figX + figW / 2, 0);
        ctx.scale(-1, 1);
        ctx.translate(-(figX + figW / 2), 0);
      }

      if (imgFigure) {
        // 第一道：以底紙色塗實剪影區域，遮住下層石紋
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(imgFigure, figX, figY, figW, figH);
        ctx.restore();

        // 第二道：以清晰黑墨壓印木刻剪影
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(imgFigure, figX, figY, figW, figH);
        ctx.restore();
      }
      ctx.restore();

      // 6. 前景：隨身道具（右下角落款，不再全版遮蔽）
      if (imgTool) {
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        const toolW = innerW * 0.36;
        const toolH = innerH * 0.42;
        const toolX = margin + innerW - toolW - 12;
        const toolY = margin + innerH - toolH - 12;
        ctx.drawImage(imgTool, toolX, toolY, toolW, toolH);
        ctx.restore();
      }

      ctx.restore(); // 結束內部繪製裁切

      // 7. 1909 古典雙層框線
      ctx.strokeStyle = "#2b261f";
      ctx.lineWidth = 3;
      ctx.strokeRect(margin, margin, innerW, innerH); // 內主框

      ctx.lineWidth = 1;
      ctx.strokeRect(margin - 6, margin - 6, innerW + 12, innerH + 12); // 外細框

      // 8. 底部情境銘刻文字
      ctx.fillStyle = "#3e382f";
      ctx.font = "italic 22px 'Times New Roman', serif";
      ctx.textAlign = "center";
      const sceneTitle = `${ASSET_CONFIG.grounds[data.ground].name} · ${ASSET_CONFIG.skies[data.sky].name}`;
      ctx.fillText(`— ${sceneTitle} —`, W / 2, H - 22);

      document.getElementById('btnDownload').style.display = "inline-block";
    }

    // 更新下方指引文字
    function updateInfoCard(data) {
      const card = document.getElementById('cardInfo');
      const title = document.getElementById('infoTitle');
      const desc = document.getElementById('infoDesc');

      const skyName = ASSET_CONFIG.skies[data.sky].name;
      const groundName = ASSET_CONFIG.grounds[data.ground].name;
      const exitName = ASSET_CONFIG.exits[data.exit].name;
      const figName = ASSET_CONFIG.figures[data.figure].name;
      const toolName = ASSET_CONFIG.tools[data.tool].name;

      title.innerText = `此時地景：${groundName} × ${skyName}`;
      desc.innerHTML = `
        <strong>【空間定位】</strong> 你正立足於「${groundName}」，仰望著「${skyName}」。<br>
        <strong>【生路與姿態】</strong> 遠方顯現「${exitName}」，而你的載具正以「${figName}」應對當前局勢。<br>
        <strong>【隨身信物】</strong> 你所配備的資源為「${toolName}」，請以此作為下一步行動與邊界防守的依據。
      `;
      card.style.display = "block";
    }

    // 下載明信片 PNG
    function downloadPostcard() {
      const link = document.createElement('a');
      link.download = `Tarot_Landscape_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
