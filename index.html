<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>偉特地景・載具校準與無誤版面調校系統</title>
  <style>
    :root {
      --bg-color: #171615;
      --card-bg: #23211f;
      --text-main: #f5f2eb;
      --accent-gold: #c5a059;
      --border-color: #3d3a36;
      --cinnabar-red: #8a3324;
      --text-muted: #a8a29e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }

    header { text-align: center; margin-bottom: 18px; }
    h1 { font-size: 1.55rem; color: var(--accent-gold); letter-spacing: 0.15em; margin-bottom: 6px; }
    p.subtitle { font-size: 0.86rem; color: var(--text-muted); }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 840px;
    }

    /* 畫布容器 */
    .canvas-wrapper {
      background-color: #fdf9f0;
      border-radius: 4px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 2;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* 按鈕 */
    .controls { display: flex; flex-direction: column; width: 100%; gap: 10px; }
    button {
      padding: 13px 20px; font-size: 0.95rem; border: 1px solid var(--accent-gold);
      background: transparent; color: var(--accent-gold); border-radius: 2px;
      cursor: pointer; letter-spacing: 0.1em; transition: all 0.2s ease;
    }
    button:hover { background: var(--accent-gold); color: #171615; }
    button.btn-primary { background: var(--cinnabar-red); border-color: var(--cinnabar-red); color: #fff; }
    button.btn-primary:hover { background: #a33e2c; border-color: #a33e2c; }

    /* 精確校準面板 */
    .tuner-panel {
      width: 100%;
      background: #1f1d1a;
      border: 1px solid var(--accent-gold);
      padding: 18px 20px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tuner-panel h3 {
      font-size: 0.95rem; color: var(--accent-gold); display: flex;
      justify-content: space-between; align-items: center;
    }

    .tuner-selectors {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px;
    }

    .tuner-selectors select {
      background: #121110; border: 1px solid var(--border-color);
      color: #fff; padding: 8px 10px; font-size: 0.85rem; border-radius: 2px; outline: none;
    }

    .section-title {
      font-size: 0.82rem; color: var(--accent-gold); margin-top: 4px; font-weight: 600;
      border-bottom: 1px solid #333; padding-bottom: 4px;
    }

    .sliders-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px;
      background: rgba(0,0,0,0.25); padding: 12px; border-radius: 3px;
    }

    .slider-item { display: flex; flex-direction: column; gap: 4px; }
    .slider-item label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
    .slider-item label span { color: var(--accent-gold); font-family: monospace; }
    .slider-item input[type="range"] { width: 100%; accent-color: var(--accent-gold); cursor: pointer; }

    .code-export {
      background: #121110; border: 1px dashed #444; padding: 10px;
      font-size: 0.78rem; color: #9cdcfe; font-family: monospace; white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <h1>偉特地景・全版面視覺精確調校盤</h1>
    <p class="subtitle">地貌 × 出口 × 人物 絕對座標校準</p>
  </header>

  <div class="main-container">
    <div class="canvas-wrapper">
      <canvas id="postcardCanvas" width="1200" height="800"></canvas>
    </div>

    <div class="controls">
      <button class="btn-primary" onclick="resetToDefaults()">重設為滿版最佳預設值</button>
    </div>

    <!-- 視覺調校盤 -->
    <div class="tuner-panel">
      <h3>
        <span>圖層切換與三軸精準校準</span>
        <span style="font-size: 0.78rem; font-weight: normal; color: var(--text-muted);">滿版定錨・滑桿平移不跑版</span>
      </h3>

      <div class="tuner-selectors">
        <div>
          <label style="font-size: 0.75rem; color:#888;">天空 (Sky)</label>
          <select id="tuneSky" onchange="liveRender()">
            <option value="sky_storm">風暴前夕 (storm)</option>
            <option value="sky_sunset">落日餘暉 (sunset)</option>
            <option value="sky_gold">暮日晨光 (gold)</option>
            <option value="sky_night">深藍子夜 (night)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">地貌 (Ground)</label>
          <select id="tuneGround" onchange="liveRender()">
            <option value="ground_terrace">石階高台 (terrace)</option>
            <option value="ground_hill">蒼茫起伏山丘 (hill)</option>
            <option value="ground_cliff">荒蕪峭壁 (cliff)</option>
            <option value="ground_water">幽暗水岸 (water)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">生路出口 (Exit)</label>
          <select id="tuneExit" onchange="liveRender()">
            <option value="exit_path">林間小徑 / 石階 (path)</option>
            <option value="exit_stream">幽谷溪流 (stream)</option>
            <option value="exit_bridge">跨谷木橋 (bridge)</option>
            <option value="exit_arch">雙塔石門 (arch)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">旅人姿態 (Figure)</label>
          <select id="tuneFigure" onchange="liveRender()">
            <option value="figure_guard">持杖防禦 (guard)</option>
            <option value="figure_walk">啟程涉足 (walk)</option>
            <option value="figure_stand">佇立凝視 (stand)</option>
            <option value="figure_sit">盤坐靜觀 (sit)</option>
          </select>
        </div>
      </div>

      <!-- 地面 (Ground) 調整 -->
      <div class="section-title">1. 地貌校準 (Ground)</div>
      <div class="sliders-grid">
        <div class="slider-item">
          <label>地貌寬度 (Ground Width) <span id="valGW">1.00</span></label>
          <input type="range" id="paramGW" min="0.60" max="1.00" step="0.01" value="1.00" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>地貌垂直高度沉降 (Ground Height) <span id="valGH">0.52</span></label>
          <input type="range" id="paramGH" min="0.30" max="0.75" step="0.01" value="0.52" oninput="liveRender()">
        </div>
      </div>

      <!-- 出口 (Exit) 調整 -->
      <div class="section-title">2. 出口校準 (Exit)</div>
      <div class="sliders-grid">
        <div class="slider-item">
          <label>水平位移 (X Offset) <span id="valExitX">0 px</span></label>
          <input type="range" id="paramExitX" min="-300" max="300" step="2" value="0" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>垂直位移 (Y Offset) <span id="valExitY">0 px</span></label>
          <input type="range" id="paramExitY" min="-200" max="200" step="2" value="0" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>整體縮放 (Exit Scale) <span id="valExitScale">1.00x</span></label>
          <input type="range" id="paramExitScale" min="0.60" max="1.40" step="0.02" value="1.00" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>旋轉角度 (Exit Rotate) <span id="valExitRot">0°</span></label>
          <input type="range" id="paramExitRot" min="-20" max="20" step="0.5" value="0" oninput="liveRender()">
        </div>
      </div>

      <!-- 人物 (Figure) 調整 -->
      <div class="section-title">3. 人物校準 (Figure)</div>
      <div class="sliders-grid">
        <div class="slider-item">
          <label>人物水平位置 (Figure X) <span id="valFigX">0.08</span></label>
          <input type="range" id="paramFigX" min="0.02" max="0.35" step="0.01" value="0.08" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>人物垂直貼地 (Figure Y) <span id="valFigY">0.90</span></label>
          <input type="range" id="paramFigY" min="0.70" max="0.98" step="0.01" value="0.90" oninput="liveRender()">
        </div>
        <div class="slider-item">
          <label>人物大小 (Figure Size) <span id="valFigH">0.38</span></label>
          <input type="range" id="paramFigH" min="0.20" max="0.55" step="0.01" value="0.38" oninput="liveRender()">
        </div>
      </div>

      <div>
        <label style="font-size: 0.75rem; color:#888;">當前最佳數值代碼（調好滿意後複製）：</label>
        <div class="code-export" id="codeExport"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('postcardCanvas');
    const ctx = canvas.getContext('2d');

    const cache = {};
    function loadImage(src) {
      if (cache[src]) return Promise.resolve(cache[src]);
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = src;
        img.onload = () => { cache[src] = img; resolve(img); };
        img.onerror = () => resolve(null);
      });
    }

    function createTransparentCanvas(img) {
      if (!img) return null;
      const off = document.createElement('canvas');
      off.width = img.naturalWidth || img.width;
      off.height = img.naturalHeight || img.height;
      const oCtx = off.getContext('2d');
      oCtx.drawImage(img, 0, 0);
      try {
        const imgData = oCtx.getImageData(0, 0, off.width, off.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] > 220 && d[i+1] > 220 && d[i+2] > 220) d[i+3] = 0;
        }
        oCtx.putImageData(imgData, 0, 0);
        return off;
      } catch(e) { return img; }
    }

    function resetToDefaults() {
      document.getElementById('paramGW').value = 1.00;
      document.getElementById('paramGH').value = 0.52;
      document.getElementById('paramExitX').value = 0;
      document.getElementById('paramExitY').value = 0;
      document.getElementById('paramExitScale').value = 1.00;
      document.getElementById('paramExitRot').value = 0;
      document.getElementById('paramFigX').value = 0.08;
      document.getElementById('paramFigY').value = 0.90;
      document.getElementById('paramFigH').value = 0.38;
      liveRender();
    }

    async function liveRender() {
      const sky = document.getElementById('tuneSky').value;
      const ground = document.getElementById('tuneGround').value;
      const exit = document.getElementById('tuneExit').value;
      const fig = document.getElementById('tuneFigure').value;

      const gW = parseFloat(document.getElementById('paramGW').value);
      const gH = parseFloat(document.getElementById('paramGH').value);
      const exitX = parseFloat(document.getElementById('paramExitX').value);
      const exitY = parseFloat(document.getElementById('paramExitY').value);
      const exitScale = parseFloat(document.getElementById('paramExitScale').value);
      const exitRot = parseFloat(document.getElementById('paramExitRot').value);
      const figX = parseFloat(document.getElementById('paramFigX').value);
      const figY = parseFloat(document.getElementById('paramFigY').value);
      const figH = parseFloat(document.getElementById('paramFigH').value);

      document.getElementById('valGW').innerText = gW.toFixed(2);
      document.getElementById('valGH').innerText = gH.toFixed(2);
      document.getElementById('valExitX').innerText = `${exitX} px`;
      document.getElementById('valExitY').innerText = `${exitY} px`;
      document.getElementById('valExitScale').innerText = `${exitScale.toFixed(2)}x`;
      document.getElementById('valExitRot').innerText = `${exitRot}°`;
      document.getElementById('valFigX').innerText = figX.toFixed(2);
      document.getElementById('valFigY').innerText = figY.toFixed(2);
      document.getElementById('valFigH').innerText = figH.toFixed(2);

      document.getElementById('codeExport').innerText = 
        `Ground: [W:${gW.toFixed(2)}, H:${gH.toFixed(2)}] | Exit: [X:${exitX}, Y:${exitY}, Scale:${exitScale.toFixed(2)}, Rot:${exitRot}°] | Fig: [X:${figX.toFixed(2)}, Y:${figY.toFixed(2)}, H:${figH.toFixed(2)}]`;

      const W = canvas.width;  // 1200
      const H = canvas.height; // 800
      ctx.clearRect(0, 0, W, H);

      const [rawSky, rawGround, rawExit, rawFigure] = await Promise.all([
        loadImage(`assets/skies/${sky}.png`),
        loadImage(`assets/grounds/${ground}.png`),
        loadImage(`assets/exits/${exit}.png`),
        loadImage(`assets/figures/${fig}.png`)
      ]);

      const imgSky = rawSky;
      const imgGround = createTransparentCanvas(rawGround);
      const imgExit = createTransparentCanvas(rawExit);
      const imgFigure = createTransparentCanvas(rawFigure);

      // 底紙
      ctx.fillStyle = "#fdf9f0";
      ctx.fillRect(0, 0, W, H);

      const margin = 32;
      const innerW = W - margin * 2;
      const innerH = H - margin * 2 - 36;

      ctx.save();
      ctx.beginPath();
      ctx.rect(margin, margin, innerW, innerH);
      ctx.clip();

// 1. 天空滿版鋪底
      if (imgSky) {
        ctx.drawImage(imgSky, margin, margin, innerW, innerH);
      }

      // 2. 出口（改為先畫！退到地貌後方，起點生硬白邊由地貌遮蔽）
      if (imgExit) {
        ctx.save();
        const anchorX = margin + innerW * 0.80;
        const anchorY = margin + innerH * 0.75;

        ctx.translate(anchorX + exitX, anchorY + exitY);
        ctx.rotate((exitRot * Math.PI) / 180);
        ctx.scale(exitScale, exitScale);
        ctx.translate(-anchorX, -anchorY);

        ctx.globalAlpha = 0.98;
        ctx.drawImage(imgExit, margin, margin, innerW, innerH);
        ctx.restore();
      }

      // 3. 地貌（改為後畫！覆蓋在出口前面，石階/礫石自然遮住橋腳與小徑底）
      if (imgGround) {
        ctx.save();
        const groundDrawW = innerW * gW;
        const groundDrawH = innerH * gH;
        const groundDrawY = margin + innerH - groundDrawH;
        ctx.drawImage(imgGround, margin, groundDrawY, groundDrawW, groundDrawH);
        ctx.restore();
      }

      // 4. 古典環境天光浸染（調和天空色溫，壓制刺眼死白）
      if (typeof SKY_TINTS !== 'undefined' && SKY_TINTS[sky]) {
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = SKY_TINTS[sky];
        ctx.fillRect(margin, margin, innerW, innerH);
        ctx.restore();
      }

      // 5. 旅人（置於最前景）
      if (imgFigure) {
        ctx.save();
        const figureHeight = innerH * figH;
        const figureAspect = (imgFigure.width / imgFigure.height) || 0.6;
        const figureWidth = figureHeight * figureAspect;
        const figurePosX = margin + (innerW * figX);
        const figurePosY = margin + (innerH * figY) - figureHeight;

        ctx.drawImage(imgFigure, figurePosX, figurePosY, figureWidth, figureHeight);
        ctx.restore();
      }

      // 偉特雙層框線
      ctx.strokeStyle = "#2b261f";
      ctx.lineWidth = 3;
      ctx.strokeRect(margin, margin, innerW, innerH);
      ctx.lineWidth = 1;
      ctx.strokeRect(margin - 6, margin - 6, innerW + 12, innerH + 12);
    }

    window.onload = () => { liveRender(); };
  </script>
</body>
</html>
