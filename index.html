<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>偉特地景・載具校準與即時視覺調校盤</title>
  <style>
    :root {
      --bg-color: #171615;
      --card-bg: #23211f;
      --text-main: #f5f2eb;
      --accent-gold: #c5a059;
      --border-color: #3d3a36;
      --cinnabar-red: #8a3324;
      --text-muted: #a8a29e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }

    header { text-align: center; margin-bottom: 18px; }
    h1 { font-size: 1.55rem; color: var(--accent-gold); letter-spacing: 0.15em; margin-bottom: 6px; }
    p.subtitle { font-size: 0.86rem; color: var(--text-muted); }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 820px;
    }

    /* 人類圖規格 */
    .hd-selector-box {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px 18px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hd-selector-box h3 { font-size: 0.95rem; color: var(--accent-gold); font-weight: 500; }
    .hd-fields { display: flex; gap: 14px; flex-wrap: wrap; }
    .hd-field-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 5px; }
    .hd-field-group label { font-size: 0.8rem; color: var(--text-muted); }
    .hd-field-group select {
      background: #171615; border: 1px solid var(--border-color);
      color: #fff; padding: 8px 10px; font-size: 0.85rem; border-radius: 2px; outline: none;
    }

    /* 畫布 */
    .canvas-wrapper {
      background-color: #fdf9f0;
      border-radius: 4px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 2;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* 按鈕 */
    .controls { display: flex; flex-direction: column; width: 100%; gap: 10px; }
    button {
      padding: 13px 20px; font-size: 0.95rem; border: 1px solid var(--accent-gold);
      background: transparent; color: var(--accent-gold); border-radius: 2px;
      cursor: pointer; letter-spacing: 0.1em; transition: all 0.2s ease;
    }
    button:hover { background: var(--accent-gold); color: #171615; }
    button.btn-primary { background: var(--cinnabar-red); border-color: var(--cinnabar-red); color: #fff; }
    button.btn-primary:hover { background: #a33e2c; border-color: #a33e2c; }
    button.btn-pay { background: #2b261f; border: 1px solid var(--accent-gold); color: var(--accent-gold); font-weight: 500; }
    button.btn-pay:hover { background: var(--accent-gold); color: #171615; }

    /* 調校面板 */
    .tuner-panel {
      width: 100%;
      background: #1f1d1a;
      border: 1px solid var(--accent-gold);
      padding: 16px 20px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tuner-panel h3 {
      font-size: 0.95rem; color: var(--accent-gold); display: flex;
      justify-content: space-between; align-items: center;
    }
    .tuner-selectors {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px;
    }
    .tuner-selectors select {
      background: #121110; border: 1px solid var(--border-color);
      color: #fff; padding: 7px 10px; font-size: 0.85rem; border-radius: 2px; outline: none;
    }
    .sliders-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px;
      background: rgba(0,0,0,0.25); padding: 12px; border-radius: 3px;
    }
    .slider-item { display: flex; flex-direction: column; gap: 4px; }
    .slider-item label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
    .slider-item label span { color: var(--accent-gold); font-family: monospace; }
    .slider-item input[type="range"] { width: 100%; accent-color: var(--accent-gold); cursor: pointer; }
    .code-export {
      background: #121110; border: 1px dashed #444; padding: 10px;
      font-size: 0.78rem; color: #9cdcfe; font-family: monospace; white-space: pre-wrap; word-break: break-all;
    }

    /* 解讀與手冊 */
    .card-info {
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 24px; border-radius: 4px; width: 100%; display: none;
    }
    .hd-badge {
      display: inline-block; border: 1px solid var(--accent-gold);
      color: var(--accent-gold); padding: 3px 10px; font-size: 0.75rem; letter-spacing: 0.08em; margin-bottom: 12px;
    }
    .card-info h2 { font-size: 1.22rem; color: var(--accent-gold); margin-bottom: 14px; font-weight: 500; }
    .celtic-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px;
      background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 3px; margin-bottom: 20px; font-size: 0.78rem; border: 1px solid #333;
    }
    .celtic-item { color: #bbb; line-height: 1.4; }
    .celtic-item span { color: var(--accent-gold); display: block; font-weight: 500; }
    .manual-content {
      font-size: 0.92rem; line-height: 1.85; color: #d6d3cd; margin-bottom: 24px;
      text-align: justify; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;
    }

    /* 付費區 */
    .payment-section {
      display: flex; flex-direction: column; gap: 14px;
      background: rgba(0, 0, 0, 0.28); padding: 18px; border-radius: 4px; border: 1px dashed #4a453e;
    }
    .invoice-opt { display: flex; align-items: center; gap: 8px; font-size: 0.84rem; color: var(--text-muted); cursor: pointer; }
    .invoice-opt input { accent-color: var(--accent-gold); cursor: pointer; }
    .invoice-input-box { display: none; flex-direction: column; gap: 8px; margin-top: 6px; }
    .invoice-input-box input {
      background: #171615; border: 1px solid var(--border-color);
      color: #fff; padding: 8px 12px; font-size: 0.85rem; border-radius: 2px; outline: none;
    }
    .unlocked-tool-card {
      display: none; background: #1d1c1a; border: 1px solid var(--accent-gold);
      padding: 16px; border-radius: 4px; margin-top: 10px; align-items: center; gap: 16px;
    }
    .unlocked-tool-card img {
      width: 72px; height: 72px; object-fit: contain; background: #fdf9f0; padding: 4px; border-radius: 2px;
    }
    .tool-desc h4 { color: var(--accent-gold); font-size: 0.95rem; margin-bottom: 4px; }
    .tool-desc p { font-size: 0.84rem; color: #bbb; line-height: 1.5; }
  </style>
</head>
<body>

  <header>
    <h1>偉特地景・載具校準</h1>
    <p class="subtitle">塞爾特十字 10 卡牌陣 × 個人人類圖原型 × 即時調校</p>
  </header>

  <div class="main-container">
    <!-- 人類圖規格設定 -->
    <div class="hd-selector-box">
      <h3>設定個人人類圖載具規格</h3>
      <div class="hd-fields">
        <div class="hd-field-group">
          <label for="selectHdType">載具類型（Type）</label>
          <select id="selectHdType" onchange="updateAuthorityOptions()">
            <option value="generator">生產者（Generator）/ 顯生（MG）</option>
            <option value="projector">投射者（Projector）</option>
            <option value="manifestor">顯示者（Manifestor）</option>
            <option value="reflector">反映者（Reflector）</option>
          </select>
        </div>
        <div class="hd-field-group">
          <label for="selectHdAuth">內在權威（Authority）</label>
          <select id="selectHdAuth">
            <option value="sacral">薦骨權威（Sacral）</option>
            <option value="solar">情緒中心權威（Solar Plexus）</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 畫布 -->
    <div class="canvas-wrapper">
      <canvas id="postcardCanvas" width="1200" height="800"></canvas>
    </div>

    <!-- 抽牌控制按鈕 -->
    <div class="controls">
      <button class="btn-primary" id="btnDraw" onclick="runCelticCrossSystem()">感應塞爾特十字十卡・顯影當下地景</button>
    </div>

    <!-- 即時視覺調校盤（常駐開放自由微調） -->
    <div class="tuner-panel">
      <h3>
        <span>即時視覺微調盤</span>
        <span style="font-size: 0.78rem; font-weight: normal; color: var(--text-muted);">抽牌後可直接拖曳微調</span>
      </h3>

      <div class="tuner-selectors">
        <div>
          <label style="font-size: 0.75rem; color:#888;">天空 (Sky)</label>
          <select id="tuneSky" onchange="manualRender()">
            <option value="sky_sunset">落日餘暉 (sunset)</option>
            <option value="sky_gold">暮日晨光 (gold)</option>
            <option value="sky_night">深藍子夜 (night)</option>
            <option value="sky_storm" selected>風暴前夕 (storm)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">地貌 (Ground)</label>
          <select id="tuneGround" onchange="manualRender()">
            <option value="ground_terrace" selected>石階高台 (terrace)</option>
            <option value="ground_hill">蒼茫起伏山丘 (hill)</option>
            <option value="ground_cliff">荒蕪峭壁 (cliff)</option>
            <option value="ground_water">幽暗水岸 (water)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">生路出口 (Exit)</label>
          <select id="tuneExit" onchange="manualRender()">
            <option value="exit_stream">幽谷溪流 (stream)</option>
            <option value="exit_path">林間小徑 (path)</option>
            <option value="exit_bridge">跨谷木橋 (bridge)</option>
            <option value="exit_arch">雙塔石門 (arch)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.75rem; color:#888;">旅人姿態 (Figure)</label>
          <select id="tuneFigure" onchange="manualRender()">
            <option value="figure_guard" selected>持杖防禦 (guard)</option>
            <option value="figure_walk">啟程涉足 (walk)</option>
            <option value="figure_stand">佇立凝視 (stand)</option>
            <option value="figure_sit">盤坐靜觀 (sit)</option>
          </select>
        </div>
      </div>

      <div class="sliders-grid">
        <!-- 地貌 -->
        <div class="slider-item">
          <label>地貌寬度 (Ground Width) <span id="valGroundW">1.00</span></label>
          <input type="range" id="tuneGroundW" min="0.50" max="1.00" step="0.01" value="1.00" oninput="manualRender()">
        </div>
        <div class="slider-item">
          <label>地貌高度沉降 (Ground Height) <span id="valGroundH">0.52</span></label>
          <input type="range" id="tuneGroundH" min="0.30" max="0.80" step="0.01" value="0.52" oninput="manualRender()">
        </div>

        <!-- 出口定位 -->
        <div class="slider-item">
          <label>出口水平 X 位置 <span id="valExitX">0.68</span></label>
          <input type="range" id="tuneExitX" min="0.30" max="0.95" step="0.01" value="0.68" oninput="manualRender()">
        </div>
        <div class="slider-item">
          <label>出口垂直 Y 位置 (貼地度) <span id="valExitY">0.96</span></label>
          <input type="range" id="tuneExitY" min="0.30" max="1.15" step="0.01" value="0.96" oninput="manualRender()">
        </div>
        <div class="slider-item">
          <label>出口縮放寬度 (Exit Size) <span id="valExitW">0.34</span></label>
          <input type="range" id="tuneExitW" min="0.10" max="0.60" step="0.01" value="0.34" oninput="manualRender()">
        </div>
        <div class="slider-item">
          <label>出口旋轉角度 (Exit Rotate) <span id="valExitRot">0°</span></label>
          <input type="range" id="tuneExitRot" min="-25" max="25" step="0.5" value="0" oninput="manualRender()">
        </div>

        <!-- 人物 -->
        <div class="slider-item">
          <label>人物水平 X 位置 <span id="valFigX">0.08</span></label>
          <input type="range" id="tuneFigX" min="0.02" max="0.35" step="0.01" value="0.08" oninput="manualRender()">
        </div>
        <div class="slider-item">
          <label>人物大小 (Figure Size) <span id="valFigH">0.38</span></label>
          <input type="range" id="tuneFigH" min="0.20" max="0.55" step="0.01" value="0.38" oninput="manualRender()">
        </div>
      </div>

      <div>
        <label style="font-size: 0.75rem; color:#888;">當前最佳參數紀錄：</label>
        <div class="code-export" id="codeExport"></div>
      </div>
    </div>

    <!-- 解讀、出廠手冊與微付費 -->
    <div class="card-info" id="cardInfo">
      <span class="hd-badge" id="hdBadge">HUMAN DESIGN 原型規格</span>
      <h2 id="infoTitle">載具出廠定位</h2>

      <div class="celtic-grid" id="celticGrid"></div>
      <div class="manual-content" id="manualText"></div>

      <div class="payment-section">
        <label class="invoice-opt">
          <input type="checkbox" id="chkInvoice" onchange="toggleInvoice()">
          需要實體手開發票代管存證（免填統編則開立個人收據存證）
        </label>
        
        <div class="invoice-input-box" id="invoiceInputs">
          <input type="text" id="invTitle" placeholder="買受人抬頭 / 姓名">
          <input type="text" id="invTaxId" placeholder="統一編號（個人免填）">
          <input type="email" id="invEmail" placeholder="存證憑據寄送 Email">
        </div>

        <button class="btn-pay" id="btnPay" onclick="handlePayment()">
          NT$ 88 微付費買斷・解鎖高解析原印明信片與專屬隨身信物
        </button>

        <div class="unlocked-tool-card" id="toolCard">
          <img id="toolImg" src="" alt="專屬法器">
          <div class="tool-desc">
            <h4 id="toolTitle">專屬隨身法器信物</h4>
            <p id="toolDetail"></p>
          </div>
        </div>

        <button id="btnDownload" style="display: none; margin-top: 10px;" onclick="downloadPostcard()">
          下載專屬高解析木刻明信片 (PNG)
        </button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('postcardCanvas');
    const ctx = canvas.getContext('2d');

    const AUTH_CONFIG = {
      generator: [
        { val: "sacral", text: "薦骨權威（Sacral）" },
        { val: "solar", text: "情緒中心權威（Solar Plexus）" }
      ],
      projector: [
        { val: "solar", text: "情緒中心權威（Solar Plexus）" },
        { val: "splenic", text: "脾／直覺權威（Splenic）" },
        { val: "self", text: "自我投射權威（Self-Projected）" },
        { val: "mental", text: "環境／無內在權威（Mental）" }
      ],
      manifestor: [
        { val: "solar", text: "情緒中心權威（Solar Plexus）" },
        { val: "splenic", text: "脾／直覺權威（Splenic）" },
        { val: "ego", text: "意志力權威（Ego）" }
      ],
      reflector: [
        { val: "lunar", text: "月亮週期權威（Lunar Cycle）" }
      ]
    };

    function updateAuthorityOptions() {
      const type = document.getElementById('selectHdType').value;
      const authSelect = document.getElementById('selectHdAuth');
      authSelect.innerHTML = AUTH_CONFIG[type].map(a => `<option value="${a.val}">${a.text}</option>`).join('');
    }

    const TAROT_DECK = [
      { name: "愚者", elem: "air" }, { name: "魔術師", elem: "air" }, { name: "女祭司", elem: "water" },
      { name: "皇后", elem: "earth" }, { name: "皇帝", elem: "fire" }, { name: "教皇", elem: "earth" },
      { name: "戀人", elem: "air" }, { name: "戰車", elem: "water" }, { name: "力量", elem: "fire" },
      { name: "隱士", elem: "earth" }, { name: "命運之輪", elem: "fire" }, { name: "正義", elem: "air" },
      { name: "倒吊人", elem: "water" }, { name: "死神", elem: "water" }, { name: "節制", elem: "fire" },
      { name: "惡魔", elem: "earth" }, { name: "高塔", elem: "fire" }, { name: "星星", elem: "air" },
      { name: "月亮", elem: "water" }, { name: "太陽", elem: "fire" }, { name: "審判", elem: "fire" },
      { name: "世界", elem: "earth" }
    ];

    const SUITS = [
      { suit: "權杖", elem: "fire" },
      { suit: "聖杯", elem: "water" },
      { suit: "寶劍", elem: "air" },
      { suit: "星幣", elem: "earth" }
    ];
    const RANKS = ["王牌", "二", "三", "四", "五", "六", "七", "八", "九", "十", "侍從", "騎士", "王后", "國王"];
    SUITS.forEach(s => {
      RANKS.forEach(r => {
        TAROT_DECK.push({ name: `${s.suit}${r}`, elem: s.elem });
      });
    });

    const ASSET_CONFIG = {
      skies: {
        sky_gold: { name: "暮日晨光", tone: "#f5d77f", elem: "fire" },
        sky_sunset: { name: "落日餘暉", tone: "#e69c6d", elem: "air" },
        sky_night: { name: "深藍子夜", tone: "#1e293b", elem: "water" },
        sky_storm: { name: "風暴前夕", tone: "#94a3b8", elem: "earth" }
      },
      exits: {
        exit_stream: { name: "幽谷溪流", elem: "water", guide: "順流而下，循著活水踏石自然渡過滯礙" },
        exit_path: { name: "林間小徑", elem: "air", guide: "放慢步伐讓路徑自現，切忌焦慮加速" },
        exit_bridge: { name: "跨谷木橋", elem: "fire", guide: "跨越鴻溝，勿向過去的沈沒成本回望" },
        exit_arch: { name: "雙塔石門", elem: "earth", guide: "需等待清晰的外在訊號方可穿越" }
      },
      grounds: {
        ground_terrace: { name: "石階高台", elem: "air", env: "舊有防禦結構穩固，可居高臨下審視全局" },
        ground_hill: { name: "蒼茫起伏山丘", elem: "earth", env: "地形平緩連綿，需要耐力穩紮穩打" },
        ground_cliff: { name: "荒蕪峭壁", elem: "fire", env: "高地懸空，考驗對真實地心引力的信任" },
        ground_water: { name: "幽暗水岸", elem: "water", env: "情緒水流暗湧，唯有讓體感沉澱方能辨別方向" }
      },
      figures: {
        figure_guard: { name: "持杖防禦", elem: "fire", posture: "防線堅固但過度消耗，請確認是在守護能量還是恐懼未知" },
        figure_walk: { name: "啟程涉足", elem: "water", posture: "動能已被喚醒，請以單步為單位確認身體的真實興奮感" },
        figure_stand: { name: "佇立凝視", elem: "air", posture: "載具就位，目光清明，凝望遠方出路" },
        figure_sit: { name: "盤坐靜觀", elem: "earth", posture: "切斷無效主動出擊，將注意力完全收回體內核心" }
      },
      tools: {
        tool_cup: { name: "盈滿聖杯", elem: "water", attr: "滋養感受與直覺流動", guide: "在複雜情境中保留心靈的純淨感知，不被現實功利淘洗。" },
        tool_pentacle: { name: "地靈星幣", elem: "earth", attr: "物質顯化與肉身扎根", guide: "把抽象意念落地為實質產物，專注每一分資源的精確調度。" },
        tool_sword: { name: "破局寶劍", elem: "air", attr: "心智清明與邊界決斷", guide: "斬斷拖泥帶水的無效關係，以理性之刃劃出神聖不可侵犯的界線。" },
        tool_wand: { name: "權杖生機", elem: "fire", attr: "意志萌芽與創造動能", guide: "點燃內在原始的行動渴望，只要興奮感在，方向自會明朗。" }
      }
    };

    const cache = {};
    function loadImage(src) {
      if (cache[src]) return Promise.resolve(cache[src]);
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = src;
        img.onload = () => { cache[src] = img; resolve(img); };
        img.onerror = () => resolve(null);
      });
    }

    function createTransparentCanvas(img) {
      if (!img) return null;
      const off = document.createElement('canvas');
      off.width = img.naturalWidth || img.width;
      off.height = img.naturalHeight || img.height;
      const oCtx = off.getContext('2d');
      oCtx.drawImage(img, 0, 0);
      try {
        const imgData = oCtx.getImageData(0, 0, off.width, off.height);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] > 220 && d[i+1] > 220 && d[i+2] > 220) d[i+3] = 0;
        }
        oCtx.putImageData(imgData, 0, 0);
        return off;
      } catch(e) { return img; }
    }

    let currentDrawData = null;

    // 手動調校盤觸發渲染
    async function manualRender() {
      const sky = document.getElementById('tuneSky').value;
      const ground = document.getElementById('tuneGround').value;
      const exit = document.getElementById('tuneExit').value;
      const fig = document.getElementById('tuneFigure').value;

      const groundWRatio = parseFloat(document.getElementById('tuneGroundW').value);
      const groundHRatio = parseFloat(document.getElementById('tuneGroundH').value);
      const exitXRatio = parseFloat(document.getElementById('tuneExitX').value);
      const exitYRatio = parseFloat(document.getElementById('tuneExitY').value);
      const exitWRatio = parseFloat(document.getElementById('tuneExitW').value);
      const exitRotDeg = parseFloat(document.getElementById('tuneExitRot').value);
      const figXRatio = parseFloat(document.getElementById('tuneFigX').value);
      const figHRatio = parseFloat(document.getElementById('tuneFigH').value);

      document.getElementById('valGroundW').innerText = groundWRatio.toFixed(2);
      document.getElementById('valGroundH').innerText = groundHRatio.toFixed(2);
      document.getElementById('valExitX').innerText = exitXRatio.toFixed(2);
      document.getElementById('valExitY').innerText = exitYRatio.toFixed(2);
      document.getElementById('valExitW').innerText = exitWRatio.toFixed(2);
      document.getElementById('valExitRot').innerText = `${exitRotDeg}°`;
      document.getElementById('valFigX').innerText = figXRatio.toFixed(2);
      document.getElementById('valFigH').innerText = figHRatio.toFixed(2);

      document.getElementById('codeExport').innerText = 
        `Ground: W=${groundWRatio.toFixed(2)}, H=${groundHRatio.toFixed(2)} | Exit: X=${exitXRatio.toFixed(2)}, Y=${exitYRatio.toFixed(2)}, W=${exitWRatio.toFixed(2)}, Rot=${exitRotDeg}° | Fig: X=${figXRatio.toFixed(2)}, H=${figHRatio.toFixed(2)}`;

      await drawComposite(sky, ground, exit, fig, {
        groundWRatio, groundHRatio, exitXRatio, exitYRatio, exitWRatio, exitRotDeg, figXRatio, figHRatio
      });
    }

    // 核心畫布合成器
    async function drawComposite(skyKey, groundKey, exitKey, figKey, params) {
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const [rawSky, rawGround, rawExit, rawFigure] = await Promise.all([
        loadImage(`assets/skies/${skyKey}.png`),
        loadImage(`assets/grounds/${groundKey}.png`),
        loadImage(`assets/exits/${exitKey}.png`),
        loadImage(`assets/figures/${figKey}.png`)
      ]);

      const imgSky = rawSky;
      const imgGround = createTransparentCanvas(rawGround);
      const imgExit = createTransparentCanvas(rawExit);
      const imgFigure = createTransparentCanvas(rawFigure);

      // 底紙
      ctx.fillStyle = "#fdf9f0";
      ctx.fillRect(0, 0, W, H);

      const margin = 32;
      const innerW = W - margin * 2;
      const innerH = H - margin * 2 - 36;

      ctx.save();
      ctx.beginPath();
      ctx.rect(margin, margin, innerW, innerH);
      ctx.clip();

      // 1. 天空
      if (imgSky) ctx.drawImage(imgSky, margin, margin, innerW, innerH);

      // 2. 地貌
      if (imgGround) {
        ctx.save();
        const gW = innerW * params.groundWRatio;
        const gH = innerH * params.groundHRatio;
        const gY = margin + innerH - gH;
        ctx.drawImage(imgGround, margin, gY, gW, gH);
        ctx.restore();
      }

      // 3. 出口
      if (imgExit) {
        ctx.save();
        const exitAspect = (imgExit.width / imgExit.height) || 1.2;
        const exitW = innerW * params.exitWRatio;
        const exitH = exitW / exitAspect;
        const exitX = margin + (innerW * params.exitXRatio);
        const exitY = margin + (innerH * params.exitYRatio) - exitH;

        const pivotX = exitX + exitW / 2;
        const pivotY = exitY + exitH;
        ctx.translate(pivotX, pivotY);
        ctx.rotate((params.exitRotDeg * Math.PI) / 180);
        ctx.translate(-pivotX, -pivotY);

        ctx.globalAlpha = 0.96;
        ctx.drawImage(imgExit, exitX, exitY, exitW, exitH);
        ctx.restore();
      }

      // 4. 人物
      if (imgFigure) {
        ctx.save();
        const figH = innerH * params.figHRatio;
        const figAspect = (imgFigure.width / imgFigure.height) || 0.6;
        const figW = figH * figAspect;
        const figX = margin + (innerW * params.figXRatio);
        const figY = margin + (innerH * 0.90) - figH;
        ctx.drawImage(imgFigure, figX, figY, figW, figH);
        ctx.restore();
      }

      ctx.restore();

      // 雙框線
      ctx.strokeStyle = "#2b261f";
      ctx.lineWidth = 3;
      ctx.strokeRect(margin, margin, innerW, innerH);
      ctx.lineWidth = 1;
      ctx.strokeRect(margin - 6, margin - 6, innerW + 12, innerH + 12);

      // 銘刻
      ctx.fillStyle = "#3e382f";
      ctx.font = "italic 20px 'Times New Roman', serif";
      ctx.textAlign = "center";
      const groundName = ASSET_CONFIG.grounds[groundKey]?.name || groundKey;
      const skyName = ASSET_CONFIG.skies[skyKey]?.name || skyKey;
      ctx.fillText(`— ${groundName} · ${skyName} —`, W / 2, H - 18);
    }

    // 抽牌流程（抽完牌會自動同步調校盤下拉選單）
    async function runCelticCrossSystem() {
      const btn = document.getElementById('btnDraw');
      btn.disabled = true;
      btn.innerText = "感應塞爾特十卡中...";

      const userType = document.getElementById('selectHdType').value;
      const userAuth = document.getElementById('selectHdAuth').value;

      const shuffled = [...TAROT_DECK].sort(() => 0.5 - Math.random());
      const cCards = shuffled.slice(0, 10);

      const celticPositions = [
        { pos: "1. 現狀核心", card: cCards[0] },
        { pos: "2. 當前阻礙", card: cCards[1] },
        { pos: "3. 意識焦點", card: cCards[2] },
        { pos: "4. 潛意識根基", card: cCards[3] },
        { pos: "5. 目標願景", card: cCards[4] },
        { pos: "6. 近未來趨勢", card: cCards[5] },
        { pos: "7. 自我姿態", card: cCards[6] },
        { pos: "8. 外在環境", card: cCards[7] },
        { pos: "9. 希望與恐懼", card: cCards[8] },
        { pos: "10. 最終結果", card: cCards[9] }
      ];

      const skyElem = cCards[9].elem || cCards[4].elem;
      const skyKey = Object.keys(ASSET_CONFIG.skies).find(k => ASSET_CONFIG.skies[k].elem === skyElem) || "sky_gold";

      const exitElem = cCards[5].elem || cCards[3].elem;
      const exitKey = Object.keys(ASSET_CONFIG.exits).find(k => ASSET_CONFIG.exits[k].elem === exitElem) || "exit_stream";

      const groundElem = cCards[1].elem || cCards[7].elem || cCards[0].elem;
      const groundKey = Object.keys(ASSET_CONFIG.grounds).find(k => ASSET_CONFIG.grounds[k].elem === groundElem) || "ground_hill";

      const figElem = cCards[6].elem || cCards[8].elem;
      const figKey = Object.keys(ASSET_CONFIG.figures).find(k => ASSET_CONFIG.figures[k].elem === figElem) || "figure_stand";

      const toolElem = cCards[2].elem;
      const toolKey = Object.keys(ASSET_CONFIG.tools).find(k => ASSET_CONFIG.tools[k].elem === toolElem) || "tool_wand";

      // 同步調校盤下拉選單
      document.getElementById('tuneSky').value = skyKey;
      document.getElementById('tuneGround').value = groundKey;
      document.getElementById('tuneExit').value = exitKey;
      document.getElementById('tuneFigure').value = figKey;

      currentDrawData = {
        userHd: { type: userType, auth: userAuth },
        celtic: celticPositions,
        sky: skyKey,
        exit: exitKey,
        ground: groundKey,
        figure: figKey,
        tool: toolKey
      };

      await manualRender();
      updateInfoCard(currentDrawData);

      btn.disabled = false;
      btn.innerText = "重新感應十卡・校準地景";
    }

    function updateInfoCard(data) {
      const card = document.getElementById('cardInfo');
      const badge = document.getElementById('hdBadge');
      const title = document.getElementById('infoTitle');
      const grid = document.getElementById('celticGrid');
      const text = document.getElementById('manualText');

      const sky = ASSET_CONFIG.skies[data.sky];
      const ground = ASSET_CONFIG.grounds[data.ground];
      const exit = ASSET_CONFIG.exits[data.exit];
      const fig = ASSET_CONFIG.figures[data.figure];
      const tool = ASSET_CONFIG.tools[data.tool];

      const HD_SPECS = {
        generator: { name: "生產者 / 原型載具", strategy: "等待回應（Wait to Respond）", notSelf: "挫折感（Frustration）", rule: "切勿用頭腦主動發起。專注眼前外界給予的刺激，傾聽薦骨發出的真實動能。" },
        projector: { name: "投射者 / 導航載具", strategy: "等待被正式邀請與賞識", notSelf: "苦澀感（Bitterness）", rule: "停止主動推銷自己的見解。唯有在對方真正開口邀請時，你的指引才能被看見並發揮價值。" },
        manifestor: { name: "顯示者 / 破局載具", strategy: "採取行動前主動告知", notSelf: "憤怒感（Anger）", rule: "你的天命在於開啟新局。但在行動踩下油門前，必須先告知受影響的周遭，以掃除阻力。" },
        reflector: { name: "反映者 / 鏡面載具", strategy: "歷經一個完整月亮週期再做重大決策", notSelf: "失望感（Disappointment）", rule: "你是環境的清澈鏡子。給予自己足夠的時間沈澱，不吸收任何外在的焦慮雜訊。" }
      };

      const AUTH_SPECS = {
        sacral: "薦骨權威（當下第一時間的身體反應）",
        solar: "情緒中心權威（情緒浪潮中沒有當下的真相，需等待週期平復）",
        splenic: "脾中心權威（當下的直覺警訊只有一次，需立即信賴）",
        ego: "意志力權威（向內確認自我承諾與驅動力）",
        self: "自我投射權威（透過向信賴的朋友傾訴聽見真心話）",
        mental: "環境權威（需處於正確舒適的空間思考）",
        lunar: "月亮週期權威（跟隨 28 天行運逐步看清全貌）"
      };

      const userSpec = HD_SPECS[data.userHd.type];
      const userAuthDesc = AUTH_SPECS[data.userHd.auth];

      badge.innerText = `YOUR SPEC：${userSpec.name}`;
      title.innerText = `出廠地景定位：${ground.name} × ${sky.name}`;

      grid.innerHTML = data.celtic.map(c => `
        <div class="celtic-item">
          <span>${c.pos}</span>
          ${c.card.name} (${c.card.elem.toUpperCase()})
        </div>
      `).join('');

      text.innerHTML = `
        <div style="background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent-gold); padding: 12px 14px; margin-bottom: 18px; font-size: 0.85rem; line-height: 1.6;">
          <strong style="color: var(--accent-gold);">【你的專屬出廠規格】</strong><br>
          ・載具類型：${userSpec.name}<br>
          ・決策權威：${userAuthDesc}<br>
          ・人生策略：${userSpec.strategy}<br>
          ・非自己警訊：${userSpec.notSelf}
        </div>
        <strong>【空間定位與天候狀態】</strong><br>
        依據牌陣實相，你的肉身載具正立足於「${ground.name}」，天候映照出「${sky.name}」。${ground.env}。<br><br>
        <strong>【出廠校準與遠方生路】</strong><br>
        請依循出廠準則：${userSpec.rule} 目前你以「${fig.name}」模式面對：${fig.posture}。而遠方唯一的生路是「${exit.name}」——${exit.guide}。<br><br>
        <strong>【隱藏隨身信物】</strong><br>
        核心資源為「${tool.name}」（${tool.attr}）。完成解鎖後可獲取完整法器圖譜與指引。
      `;

      document.getElementById('toolCard').style.display = "none";
      document.getElementById('btnPay').style.display = "block";
      document.getElementById('btnDownload').style.display = "none";
      card.style.display = "block";
    }

    function toggleInvoice() {
      const chk = document.getElementById('chkInvoice');
      document.getElementById('invoiceInputs').style.display = chk.checked ? "flex" : "none";
    }

    function handlePayment() {
      const chk = document.getElementById('chkInvoice').checked;
      let invoiceMsg = "開立個人存證代管收據";
      if (chk) {
        const title = document.getElementById('invTitle').value.trim();
        const taxId = document.getElementById('invTaxId').value.trim();
        const email = document.getElementById('invEmail').value.trim();
        invoiceMsg = `手開發票存證：抬頭「${title || '個人'}」，統編「${taxId || '無'}」，寄送「${email || '未填寫'}」`;
      }
      alert(`【微付費買斷確認】\n金額：NT$ 88\n發票代管：${invoiceMsg}\n\n已成功解鎖高解析原印明信片與專屬信物卡！`);

      const tool = ASSET_CONFIG.tools[currentDrawData.tool];
      const toolImgEl = document.getElementById('toolImg');
      toolImgEl.onerror = function() {
        this.onerror = null;
        this.src = `https://api.iconify.design/game-icons:pentacle.svg?color=%23c5a059`;
      };
      toolImgEl.src = `assets/tools/${currentDrawData.tool}.png`;

      document.getElementById('toolTitle').innerText = `解鎖隨身法器：${tool.name}`;
      document.getElementById('toolDetail').innerHTML = `<strong>【核心屬性】</strong>${tool.attr}<br><strong>【出廠使用法則】</strong>${tool.guide}`;

      document.getElementById('toolCard').style.display = "flex";
      document.getElementById('btnPay').style.display = "none";
      document.getElementById('btnDownload').style.display = "block";
    }

    function downloadPostcard() {
      const link = document.createElement('a');
      link.download = `Tarot_CelticCross_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.onload = () => { manualRender(); };
  </script>
