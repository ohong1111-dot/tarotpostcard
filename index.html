<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>偉特地景・塞爾特十卡心靈載具校準系統</title>
  <style>
    :root {
      --bg-color: #171615;
      --card-bg: #23211f;
      --text-main: #f5f2eb;
      --accent-gold: #c5a059;
      --border-color: #3d3a36;
      --cinnabar-red: #8a3324;
      --text-muted: #a8a29e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 16px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: var(--accent-gold);
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      max-width: 780px;
    }

    /* 橫版古典明信片 3:2 容器 */
    .canvas-wrapper {
      background-color: #fdf9f0;
      border-radius: 4px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 2;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      flex-direction: column;
      width: 100%;
      gap: 12px;
    }

    button {
      padding: 13px 20px;
      font-size: 0.95rem;
      border: 1px solid var(--accent-gold);
      background: transparent;
      color: var(--accent-gold);
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent-gold);
      color: #171615;
    }

    button.btn-primary {
      background: var(--cinnabar-red);
      border-color: var(--cinnabar-red);
      color: #fff;
    }

    button.btn-primary:hover {
      background: #a33e2c;
      border-color: #a33e2c;
    }

    button.btn-pay {
      background: #2b261f;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-weight: 500;
    }

    button.btn-pay:hover {
      background: var(--accent-gold);
      color: #171615;
    }

    /* 塞爾特十卡與300字手冊區塊 */
    .card-info {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 4px;
      width: 100%;
      display: none;
    }

    .hd-badge {
      display: inline-block;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 3px 10px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .card-info h2 {
      font-size: 1.22rem;
      color: var(--accent-gold);
      margin-bottom: 14px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    /* 十卡牌陣展開預覽微縮清單 */
    .celtic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 3px;
      margin-bottom: 20px;
      font-size: 0.78rem;
      border: 1px solid #333;
    }

    .celtic-item {
      color: #bbb;
      line-height: 1.4;
    }

    .celtic-item span {
      color: var(--accent-gold);
      display: block;
      font-weight: 500;
    }

    .manual-content {
      font-size: 0.92rem;
      line-height: 1.85;
      color: #d6d3cd;
      margin-bottom: 24px;
      text-align: justify;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    /* 付費買斷與信物解鎖區塊 */
    .payment-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(0, 0, 0, 0.28);
      padding: 18px;
      border-radius: 4px;
      border: 1px dashed #4a453e;
    }

    .invoice-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .invoice-opt input {
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .invoice-input-box {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .invoice-input-box input {
      background: #171615;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      font-size: 0.85rem;
      border-radius: 2px;
      outline: none;
    }

    .invoice-input-box input:focus {
      border-color: var(--accent-gold);
    }

    .unlocked-tool-card {
      display: none;
      background: #1d1c1a;
      border: 1px solid var(--accent-gold);
      padding: 16px;
      border-radius: 4px;
      margin-top: 10px;
      align-items: center;
      gap: 16px;
    }

    .unlocked-tool-card img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      background: #fdf9f0;
      padding: 4px;
      border-radius: 2px;
    }

    .tool-desc h4 {
      color: var(--accent-gold);
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .tool-desc p {
      font-size: 0.84rem;
      color: #bbb;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>偉特地景・載具校準</h1>
    <p class="subtitle">塞爾特十字 10 卡牌陣 × 20 元素顯影 × 人類圖出廠手冊</p>
  </header>

  <div class="main-container">
    <div class="canvas-wrapper">
      <canvas id="postcardCanvas" width="1200" height="800"></canvas>
    </div>

    <div class="controls">
      <button class="btn-primary" id="btnDraw" onclick="runCelticCrossSystem()">感應塞爾特十字十卡・顯影當下地景</button>
    </div>

    <div class="card-info" id="cardInfo">
      <span class="hd-badge" id="hdBadge">HUMAN DESIGN 原型規格</span>
      <h2 id="infoTitle">載具出廠定位</h2>

      <!-- 塞爾特十字十張牌陣映射結果 -->
      <div class="celtic-grid" id="celticGrid"></div>
      
      <!-- 300字出廠手冊 -->
      <div class="manual-content" id="manualText"></div>

      <!-- NT$88 微付費買斷與法器信物 -->
      <div class="payment-section">
        <label class="invoice-opt">
          <input type="checkbox" id="chkInvoice" onchange="toggleInvoice()">
          需要實體手開發票代管存證（免填統編則開立個人收據存證）
        </label>
        
        <div class="invoice-input-box" id="invoiceInputs">
          <input type="text" id="invTitle" placeholder="買受人抬頭 / 姓名">
          <input type="text" id="invTaxId" placeholder="統一編號（個人免填）">
          <input type="email" id="invEmail" placeholder="存證憑據寄送 Email">
        </div>

        <button class="btn-pay" id="btnPay" onclick="handlePayment()">
          NT$ 88 微付費買斷・解鎖高解析原印明信片與專屬隨身信物
        </button>

        <div class="unlocked-tool-card" id="toolCard">
          <img id="toolImg" src="" alt="專屬法器">
          <div class="tool-desc">
            <h4 id="toolTitle">專屬隨身法器信物</h4>
            <p id="toolDetail"></p>
          </div>
        </div>

        <button id="btnDownload" style="display: none; margin-top: 10px;" onclick="downloadPostcard()">
          下載專屬高解析木刻明信片 (PNG)
        </button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('postcardCanvas');
    const ctx = canvas.getContext('2d');

    // 78 張標準偉特牌庫（定義元素與能量傾向）
    const TAROT_DECK = [
      // 大阿爾克那 (22)
      { name: "愚者", elem: "air" }, { name: "魔術師", elem: "air" }, { name: "女祭司", elem: "water" },
      { name: "皇后", elem: "earth" }, { name: "皇帝", elem: "fire" }, { name: "教皇", elem: "earth" },
      { name: "戀人", elem: "air" }, { name: "戰車", elem: "water" }, { name: "力量", elem: "fire" },
      { name: "隱士", elem: "earth" }, { name: "命運之輪", elem: "fire" }, { name: "正義", elem: "air" },
      { name: "倒吊人", elem: "water" }, { name: "死神", elem: "water" }, { name: "節制", elem: "fire" },
      { name: "惡魔", elem: "earth" }, { name: "高塔", elem: "fire" }, { name: "星星", elem: "air" },
      { name: "月亮", elem: "water" }, { name: "太陽", elem: "fire" }, { name: "審判", elem: "fire" },
      { name: "世界", elem: "earth" }
    ];

    // 補充小阿爾克那四組牌
    const SUITS = [
      { suit: "權杖", elem: "fire" },
      { suit: "聖杯", elem: "water" },
      { suit: "寶劍", elem: "air" },
      { suit: "星幣", elem: "earth" }
    ];
    const RANKS = ["王牌", "二", "三", "四", "五", "六", "七", "八", "九", "十", "侍從", "騎士", "王后", "國王"];
    SUITS.forEach(s => {
      RANKS.forEach(r => {
        TAROT_DECK.push({ name: `${s.suit}${r}`, elem: s.elem });
      });
    });

    // 20 個木刻風景與信物配置
    const ASSET_CONFIG = {
      skies: {
        sky_gold: { name: "暮日晨光", tone: "#f5d77f", elem: "fire", hdState: "薦骨動能飽滿 / 處於清晰回應週期" },
        sky_grey: { name: "冷冽長空", tone: "#cfd6df", elem: "air", hdState: "頭腦中心空白 / 外在資訊雜音過載" },
        sky_night: { name: "深藍子夜", tone: "#1e293b", elem: "water", hdState: "直覺中心未定義 / 需停步校準安全邊界" },
        sky_storm: { name: "風暴前夕", tone: "#94a3b8", elem: "earth", hdState: "情緒中心週期波動 / 切忌在浪潮頂點做決定" }
      },
      exits: {
        exit_arch: { name: "雙塔石門", elem: "earth", guide: "需等待正式邀請或明晰訊號方可穿越" },
        exit_bridge: { name: "跨谷木橋", elem: "fire", guide: "依靠薦骨單次反應前進，勿向過去回望" },
        exit_gate: { name: "城邦閘口", elem: "air", guide: "建立明確的物理邊界，停止為他人非自己承擔責任" },
        exit_path: { name: "林間小徑", elem: "water", guide: "跟隨身體微小牽引，放慢步伐讓路徑自現" }
      },
      grounds: {
        ground_cliff: { name: "荒蕪峭壁", baseTone: "#9e9484", elem: "fire", env: "高地懸空，考驗對真實地心引力的信任" },
        ground_desert: { name: "蒼茫荒漠", baseTone: "#c2ab7c", elem: "earth", env: "資源單一化，正是關閉干擾、專注核心出廠設定之時" },
        ground_ruin: { name: "殘垣基底", baseTone: "#8b8377", elem: "air", env: "舊有防禦機制已碎裂，不必急於重建，席地安坐即可" },
        ground_water: { name: "幽暗水岸", baseTone: "#4b6068", elem: "water", env: "情緒水流暗湧，唯有讓體感沉澱方能辨別方向" }
      },
      figures: {
        figure_guard: { name: "持杖防禦", elem: "fire", posture: "防線堅固但過度消耗，請確認是在守護能量還是恐懼未知" },
        figure_sit: { name: "盤坐靜觀", elem: "earth", posture: "切斷無效主動出擊，將注意力完全收回體內核心" },
        figure_stand: { name: "佇立凝視", elem: "air", posture: "載具就位，目光清明，凝望遠方出路" },
        figure_walk: { name: "啟程涉足", elem: "water", posture: "動能已被喚醒，請以單步為單位確認身體的真實興奮感" }
      },
      tools: {
        tool_cup: { name: "盈滿聖杯", elem: "water", attr: "滋養感受與直覺流動", guide: "在複雜情境中保留心靈的純淨感知，不被現實功利淘洗。" },
        tool_pentacle: { name: "地靈星幣", elem: "earth", attr: "物質顯化與肉身扎根", guide: "把抽象意念落地為實質產物，專注每一分資源的精確調度。" },
        tool_sword: { name: "破局寶劍", elem: "air", attr: "心智清明與邊界決斷", guide: "斬斷拖泥帶水的無效關係，以理性之刃劃出神聖不可侵犯的界線。" },
        tool_wand: { name: "權杖生機", elem: "fire", attr: "意志萌芽與創造動能", guide: "點燃內在原始的行動渴望，只要興奮感在，方向自會明朗。" }
      }
    };

    const HD_MAPPING = {
      sky_gold: {
        type: "生產者 / 原型載具",
        authority: "薦骨權威（Sacral）",
        strategy: "等待回應（Wait to Respond）",
        notSelf: "挫折感（Frustration）",
        centerState: "薦骨中心有定義・動能飽滿",
        coreGuidance: "你的動力必須由外界刺激觸發，不可用頭腦預設立場強行發起。傾聽身體第一時間的嗯／嗯嗯聲。"
      },
      sky_grey: {
        type: "投射者 / 導航載具",
        authority: "自我投射 / 心理外在權威",
        strategy: "等待被正式邀請與賞識",
        notSelf: "苦澀感（Bitterness）",
        centerState: "頭腦與邏輯中心開放・接收外界雜訊",
        coreGuidance: "頭腦中的焦慮並非你的課題，那是周遭環境的思維殘留。切勿試圖回答所有問題，退後一步觀察全局。"
      },
      sky_night: {
        type: "顯示者 / 破局載具",
        authority: "脾中心直覺權威（Splenic）",
        strategy: "採取行動前告知相關人等",
        notSelf: "憤怒感（Anger）",
        centerState: "直覺中心未定義・警戒安全邊界",
        coreGuidance: "直覺的聲音只有一次且稍縱即逝。注意身體在幽暗水岸邊的緊繃感，那是不假思索的生存警訊。"
      },
      sky_storm: {
        type: "情緒型生產者 / 浪潮載具",
        authority: "情緒中心權威（Solar Plexus）",
        strategy: "等待情緒浪潮平復後再做回應",
        notSelf: "急躁做決定帶來的悔恨",
        centerState: "情緒中心強烈波動・週期循環中",
        coreGuidance: "此刻正在風暴浪潮的尖峰或谷底，當下沒有任何真相。給自己充足時間睡一覺，平靜時答案自明。"
      }
    };

    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = src;
        if (img.complete) return resolve(img);
        img.onload = () => {
          if ('decode' in img) {
            img.decode().then(() => resolve(img)).catch(() => resolve(img));
          } else {
            resolve(img);
          }
        };
        img.onerror = () => {
          console.warn("未找到圖檔：", src);
          resolve(null);
        };
      });
    }

    function createTransparentCanvas(img) {
      if (!img) return null;
      const offCanvas = document.createElement('canvas');
      offCanvas.width = img.naturalWidth || img.width;
      offCanvas.height = img.naturalHeight || img.height;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(img, 0, 0);

      try {
        const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i] > 230 && data[i + 1] > 230 && data[i + 2] > 230) {
            data[i + 3] = 0;
          }
        }
        offCtx.putImageData(imgData, 0, 0);
        return offCanvas;
      } catch (e) {
        return img;
      }
    }

    let currentDrawData = null;

    // 塞爾特十字 10 卡核心抽牌與元素加權映射
    async function runCelticCrossSystem() {
      const btn = document.getElementById('btnDraw');
      btn.disabled = true;
      btn.innerText = "感應洗牌・排定塞爾特十卡中...";

      // 1. 洗牌並抽出 10 張牌
      const shuffled = [...TAROT_DECK].sort(() => 0.5 - Math.random());
      const cCards = shuffled.slice(0, 10);

      const celticPositions = [
        { pos: "1. 現狀核心", card: cCards[0] },
        { pos: "2. 當前阻礙", card: cCards[1] },
        { pos: "3. 意識焦點", card: cCards[2] },
        { pos: "4. 潛意識根基", card: cCards[3] },
        { pos: "5. 目標願景", card: cCards[4] },
        { pos: "6. 近未來趨勢", card: cCards[5] },
        { pos: "7. 自我姿態", card: cCards[6] },
        { pos: "8. 外在環境", card: cCards[7] },
        { pos: "9. 希望與恐懼", card: cCards[8] },
        { pos: "10. 最終結果", card: cCards[9] }
      ];

      // 2. 映射 20 個元素
      // 天空：由 第5張(願景) + 第10張(結果) 的主要元素決定
      const skyElem = cCards[9].elem || cCards[4].elem;
      const skyKey = Object.keys(ASSET_CONFIG.skies).find(k => ASSET_CONFIG.skies[k].elem === skyElem) || "sky_gold";

      // 出口：由 第4張(潛意識) + 第6張(未來) 決定
      const exitElem = cCards[5].elem || cCards[3].elem;
      const exitKey = Object.keys(ASSET_CONFIG.exits).find(k => ASSET_CONFIG.exits[k].elem === exitElem) || "exit_gate";

      // 地貌：由 第1張(現狀) + 第2張(阻礙) + 第8張(環境) 決定
      const groundElem = cCards[1].elem || cCards[7].elem || cCards[0].elem;
      const groundKey = Object.keys(ASSET_CONFIG.grounds).find(k => ASSET_CONFIG.grounds[k].elem === groundElem) || "ground_desert";

      // 旅人姿態：由 第7張(自我姿態) + 第9張(希望與恐懼) 決定
      const figElem = cCards[6].elem || cCards[8].elem;
      const figKey = Object.keys(ASSET_CONFIG.figures).find(k => ASSET_CONFIG.figures[k].elem === figElem) || "figure_stand";

      // 隨身信物：由 第3張(核心意識焦點) 決定，作為付費解鎖法器
      const toolElem = cCards[2].elem;
      const toolKey = Object.keys(ASSET_CONFIG.tools).find(k => ASSET_CONFIG.tools[k].elem === toolElem) || "tool_wand";

      currentDrawData = {
        celtic: celticPositions,
        sky: skyKey,
        exit: exitKey,
        ground: groundKey,
        figure: figKey,
        tool: toolKey,
        timestamp: new Date().toISOString()
      };

      // 3. 繪製明信片
      await renderLandscape(currentDrawData);

      // 4. 生成下方報告與牌陣資訊
      updateInfoCard(currentDrawData);

      btn.disabled = false;
      btn.innerText = "重新感應十卡・校準地景";
    }

    // 橫版明信片渲染引擎
    async function renderLandscape(data) {
      const W = canvas.width;  // 1200
      const H = canvas.height; // 800

      ctx.clearRect(0, 0, W, H);

      const [rawSky, rawExit, rawGround, rawFigure] = await Promise.all([
        loadImage(`assets/skies/${data.sky}.png`),
        loadImage(`assets/exits/${data.exit}.png`),
        loadImage(`assets/grounds/${data.ground}.png`),
        loadImage(`assets/figures/${data.figure}.png`)
      ]);

      const imgSky = rawSky;
      const imgExit = createTransparentCanvas(rawExit);
      const imgGround = rawGround;
      const imgFigure = createTransparentCanvas(rawFigure);

      // 1. 底紙羊皮紙留白
      ctx.fillStyle = "#fdf9f0";
      ctx.fillRect(0, 0, W, H);

      const margin = 32;
      const innerW = W - margin * 2;
      const innerH = H - margin * 2 - 36;

      ctx.save();
      ctx.beginPath();
      ctx.rect(margin, margin, innerW, innerH);
      ctx.clip(); // 建立邊界遮罩

      // 2. 遠景：天空底色（全版鋪滿內框）
      ctx.globalCompositeOperation = 'source-over';
      if (imgSky) {
        ctx.drawImage(imgSky, margin, margin, innerW, innerH);
      } else {
        const skyGrad = ctx.createLinearGradient(0, margin, 0, margin + innerH * 0.7);
        skyGrad.addColorStop(0, ASSET_CONFIG.skies[data.sky].tone);
        skyGrad.addColorStop(1, "#fcf6e8");
        ctx.fillStyle = skyGrad;
        ctx.fillRect(margin, margin, innerW, innerH);
      }

      // 3. 遠方生路出口（微縮遠景，座落右側遠方地平線，創造深遠空間感）
      if (imgExit) {
        ctx.save();
        ctx.globalAlpha = 0.82;
        ctx.globalCompositeOperation = 'multiply';
        const exitW = innerW * 0.26;
        const exitH = innerH * 0.46;
        const exitX = margin + innerW - exitW - (innerW * 0.06);
        const exitY = margin + (innerH * 0.26);
        ctx.drawImage(imgExit, exitX, exitY, exitW, exitH);
        ctx.restore();
      }

      // 4. 中景至近景：立足地貌（強制接地，消除懸空）
      const groundInfo = ASSET_CONFIG.grounds[data.ground];
      const groundH = innerH * 0.54;
      const groundTopY = margin + innerH - groundH;

      // 4-1. 大地沉積底層漸層（避免圖檔未滿版時露出白底）
      ctx.save();
      const baseGrad = ctx.createLinearGradient(0, groundTopY, 0, margin + innerH);
      baseGrad.addColorStop(0, "rgba(235, 226, 208, 0)");
      baseGrad.addColorStop(0.35, "rgba(210, 198, 175, 0.6)");
      baseGrad.addColorStop(1, groundInfo.baseTone);
      ctx.fillStyle = baseGrad;
      ctx.fillRect(margin, groundTopY, innerW, groundH);
      ctx.restore();

      // 4-2. 繪製地貌圖層（長漸層羽化融入天空）
      if (imgGround) {
        const gCanvas = document.createElement('canvas');
        gCanvas.width = innerW;
        gCanvas.height = groundH;
        const gCtx = gCanvas.getContext('2d');

        gCtx.drawImage(imgGround, 0, 0, innerW, groundH);

        // 頂端 40% 平滑過渡
        gCtx.globalCompositeOperation = 'destination-in';
        const fadeGrad = gCtx.createLinearGradient(0, 0, 0, groundH * 0.40);
        fadeGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        fadeGrad.addColorStop(1, 'rgba(0, 0, 0, 1)');
        gCtx.fillStyle = fadeGrad;
        gCtx.fillRect(0, 0, innerW, groundH);

        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(gCanvas, margin, groundTopY, innerW, groundH);
        ctx.restore();
      }

      // 5. 主角：旅人剪影（固定在左側 16%，雙腳踩實近景地面）
      const figH = innerH * 0.36;
      const figW = figH * 0.68;
      const figX = margin + (innerW * 0.16);
      const figY = margin + innerH - figH - 14;

      ctx.save();
      if (imgFigure) {
        // 第一層：挖空下方地紋，消除穿透
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.drawImage(imgFigure, figX, figY, figW, figH);
        ctx.restore();

        // 第二層：清晰木刻黑墨壓印
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.drawImage(imgFigure, figX, figY, figW, figH);
        ctx.restore();
      }
      ctx.restore();

      ctx.restore(); // 結束裁切

      // 6. 1909 偉特古典雙層框線
      ctx.strokeStyle = "#2b261f";
      ctx.lineWidth = 3;
      ctx.strokeRect(margin, margin, innerW, innerH);

      ctx.lineWidth = 1;
      ctx.strokeRect(margin - 6, margin - 6, innerW + 12, innerH + 12);

      // 7. 底部情境銘刻文字
      ctx.fillStyle = "#3e382f";
      ctx.font = "italic 20px 'Times New Roman', serif";
      ctx.textAlign = "center";
      const sceneTitle = `${ASSET_CONFIG.grounds[data.ground].name} · ${ASSET_CONFIG.skies[data.sky].name}`;
      ctx.fillText(`— ${sceneTitle} —`, W / 2, H - 18);
    }

    // 生成塞爾特十字 10 卡與 300 字人類圖報告

      const ground = ASSET_CONFIG.grounds[data.ground];
      const exit = ASSET_CONFIG.exits[data.exit];
      const fig = ASSET_CONFIG.figures[data.figure];
      const tool = ASSET_CONFIG.tools[data.tool];
      const hd = HD_MAPPING[data.sky];

      badge.innerText = `HUMAN DESIGN 原型規格：${hd.type}`;
      title.innerText = `出廠地景定位：${ground.name} × ${sky.name}`;

      // 列出 10 張牌微縮資訊
      grid.innerHTML = data.celtic.map(c => `
        <div class="celtic-item">

          ${c.card.name} (${c.card.elem.toUpperCase()})

      // 300字深度出廠手冊
      text.innerHTML = `
        <div style="background: rgba(0,0,0,0.3); border-left: 3px solid var(--accent-gold); padding: 12px 14px; margin-bottom: 18px; font-size: 0.85rem; line-height: 1.6;">
          <strong style="color: var(--accent-gold);">【載具出廠規格參數】</strong><br>
          ・內在權威：${hd.authority}<br>
          ・人生策略：${hd.strategy}<br>
          ・當前能量中心：${hd.centerState}<br>
          ・非自己警訊：${hd.notSelf}
        </div>

        <strong>【空間定位與天候狀態】</strong><br>
        依據牌陣第 1、2、8 張牌所聚合之實相，你正立足於「${ground.name}」，天候呈現「${sky.name}」。${ground.env}。此時載具處於：${sky.hdState}。外在環境的壓力是當前場域既有的物理規律，無須動用頭腦過度賦予恐慌意義。<br><br>

        <strong>【姿態校準與遠方生路】</strong><br>
        由第 7、9 張牌映射，你的載具安立於左方近景，呈現「${fig.name}」的模式：${fig.posture}。第 4、6 張牌則為你指引出右側遠方的「${exit.name}」——這代表此時此地唯一的生路出口：${exit.guide}。由近處立足點望向遠方，無須焦躁疾行，路徑自會由身體動能帶領展開。<br><br>

        <strong>【隱藏隨身信物】</strong><br>
        源於第 3 張意識焦點牌，你此行配備的核心信物為「${tool.name}」（${tool.attr}）。此信物已收斂至你的載具核心，完成解鎖後可獲取完整法器圖譜與邊界使用指引。
      `;

      document.getElementById('toolCard').style.display = "none";
      document.getElementById('btnPay').style.display = "block";
      document.getElementById('btnDownload').style.display = "none";

      card.style.display = "block";
    }

    function toggleInvoice() {
      const chk = document.getElementById('chkInvoice');
      const inputs = document.getElementById('invoiceInputs');
      inputs.style.display = chk.checked ? "flex" : "none";
    }

    function handlePayment() {
      const chk = document.getElementById('chkInvoice').checked;
      let invoiceMsg = "開立個人存證代管收據";

      if (chk) {
        const title = document.getElementById('invTitle').value.trim();
        const taxId = document.getElementById('invTaxId').value.trim();
        const email = document.getElementById('invEmail').value.trim();
        invoiceMsg = `手開發票存證：抬頭「${title || '個人'}」，統編「${taxId || '無'}」，寄送「${email || '未填寫'}」`;
      }

      alert(`【微付費買斷確認】\n金額：NT$ 88\n發票代管：${invoiceMsg}\n\n已成功解鎖高解析原印明信片與專屬信物卡！`);

      const tool = ASSET_CONFIG.tools[currentDrawData.tool];
      document.getElementById('toolImg').src = `assets/tools/${currentDrawData.tool}.png`;
      document.getElementById('toolTitle').innerText = `解鎖隨身法器：${tool.name}`;
      document.getElementById('toolDetail').innerHTML = `<strong>【核心屬性】</strong>${tool.attr}<br><strong>【出廠使用法則】</strong>${tool.guide}`;

      document.getElementById('toolCard').style.display = "flex";
      document.getElementById('btnPay').style.display = "none";
      document.getElementById('btnDownload').style.display = "block";
    }

    function downloadPostcard() {
      const link = document.createElement('a');
      link.download = `Tarot_CelticCross_Wide_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
