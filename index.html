<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>偉特地景・生版畫視覺校調儀</title>
  <style>
    :root {
      --bg-wood: #181614;
      --panel-bg: #221e1a;
      --border-parchment: #c2b490;
      --accent-gold: #d4af37;
      --accent-cyan: #4ecdc4;
      --text-main: #f5f0e6;
      --text-muted: #a89f91;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-wood);
      color: var(--text-main);
      font-family: "PingFang TC", "Noto Sans TC", "Songti TC", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .workbench {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      max-width: 1120px;
    }

    .stage-container {
      position: relative;
      background: #0d0c0b;
      padding: 10px;
      border: 1px solid #3d352c;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
      border-radius: 4px;
    }

    canvas {
      display: block;
      background-color: #e8e0cc;
      max-width: 100%;
      height: auto;
    }

    .controls-panel {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid #3d352c;
      border-radius: 4px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 0.78rem;
      color: var(--accent-gold);
      display: flex;
      justify-content: space-between;
    }

    .control-group label span.val {
      color: var(--accent-cyan);
      font-family: monospace;
    }

    select, input[type="range"], button {
      background: #141210;
      border: 1px solid #4a3f35;
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 3px;
      font-size: 0.82rem;
      outline: none;
    }

    select:focus, button:focus {
      border-color: var(--accent-gold);
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--accent-gold);
      border-bottom: 1px solid #3d352c;
      padding-bottom: 4px;
      margin-top: 4px;
    }

    .slider-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      background: #191613;
      padding: 10px 12px;
      border-radius: 4px;
      border: 1px solid #2d2620;
    }

    input[type="range"] {
      padding: 0;
      height: 6px;
      cursor: pointer;
      accent-color: var(--accent-gold);
    }

    .toggles-and-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 4px;
    }

    .checkbox-label {
      font-size: 0.82rem;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      cursor: pointer;
      font-weight: 500;
      padding: 6px 14px;
      background: #2f2720;
      border-color: #554536;
    }

    button:hover {
      background: #42362b;
      color: var(--accent-gold);
    }

    button.primary {
      background: #7a2b22;
      border-color: #a83c30;
      color: #fff;
    }

    .coords-output {
      font-family: monospace;
      font-size: 0.78rem;
      background: #0f0d0b;
      padding: 8px 12px;
      border-radius: 3px;
      color: #9fe6a0;
      border: 1px solid #28221b;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <h1>偉特地景・生版畫視覺校調儀</h1>
    <p>水平軸 / 垂直軸 / 咬合點 原始座標工程儀表板</p>
  </header>

  <div class="workbench">
    <div class="stage-container">
      <canvas id="tarotCanvas" width="1200" height="800"></canvas>
    </div>

    <div class="controls-panel">
      <!-- 1. 素材選擇器 -->
      <div class="selector-grid">
        <div class="control-group">
          <label>天空 (Sky)</label>
          <select id="selSky">
            <option value="sky_gold">金黃天光 (sky_gold)</option>
            <option value="sky_night">幽暗夜空 (sky_night / 鏡像)</option>
            <option value="sky_sunset">落日餘暉 (sky_sunset)</option>
            <option value="sky_storm">風暴雷雲 (sky_storm)</option>
          </select>
        </div>

        <div class="control-group">
          <label>地貌 (Ground)</label>
          <select id="selGround">
            <option value="ground_terrace">石階高台 (ground_terrace)</option>
            <option value="ground_hill">起伏山丘 (ground_hill)</option>
            <option value="ground_cliff">荒蕪峭壁 (ground_cliff)</option>
            <option value="ground_water">幽暗水岸 (ground_water)</option>
          </select>
        </div>

        <div class="control-group">
          <label>生路出口 (Exit)</label>
          <select id="selExit">
            <option value="exit_arch">雙塔石門 (exit_arch)</option>
            <option value="exit_bridge">跨谷木橋 (exit_bridge)</option>
            <option value="exit_path">林間小徑 (exit_path)</option>
            <option value="exit_stream">幽谷溪流 (exit_stream)</option>
          </select>
        </div>

        <div class="control-group">
          <label>旅人姿態 (Figure)</label>
          <select id="selFigure">
            <option value="figure_guard">手持長杖 (figure_guard)</option>
            <option value="figure_stand">直立眺望 (figure_stand)</option>
            <option value="figure_sit">席地而坐 (figure_sit)</option>
            <option value="figure_walk">邁步前行 (figure_walk)</option>
          </select>
        </div>
      </div>

      <!-- 2. 生路出口 軸向定位 -->
      <div class="section-title">生路出口 (Exit) 軸向定位</div>
      <div class="slider-row">
        <div class="control-group">
          <label>出口 X 軸位移 <span class="val" id="valExitX">0px</span></label>
          <input type="range" id="rngExitX" min="-400" max="400" step="1" value="0">
        </div>
        <div class="control-group">
          <label>出口 Y 軸位移 <span class="val" id="valExitY">0px</span></label>
          <input type="range" id="rngExitY" min="-300" max="300" step="1" value="0">
        </div>
        <div class="control-group">
          <label>等比縮放 <span class="val" id="valExitScale">1.00x</span></label>
          <input type="range" id="rngExitScale" min="0.5" max="1.6" step="0.01" value="1.00">
        </div>
        <div class="control-group">
          <label>角度旋轉 <span class="val" id="valExitRot">0°</span></label>
          <input type="range" id="rngExitRot" min="-20" max="20" step="0.5" value="0">
        </div>
      </div>

      <!-- 3. 地貌 軸向定位 -->
      <div class="section-title">地貌 (Ground) 軸向定位</div>
      <div class="slider-row">
        <div class="control-group">
          <label>地貌 寬度比例 <span class="val" id="valGroundW">1.00</span></label>
          <input type="range" id="rngGroundW" min="0.7" max="1.4" step="0.01" value="1.00">
        </div>
        <div class="control-group">
          <label>地貌 高度延展 <span class="val" id="valGroundH">0.52</span></label>
          <input type="range" id="rngGroundH" min="0.3" max="0.8" step="0.01" value="0.52">
        </div>
        <div class="control-group">
          <label>地貌 底部微調 (正值往下壓) <span class="val" id="valGroundY">0px</span></label>
          <input type="range" id="rngGroundY" min="-30" max="60" step="1" value="0">
        </div>
      </div>

      <!-- 4. 旅人 軸向定位 -->
      <div class="section-title">旅人 (Figure) 軸向定位</div>
      <div class="slider-row">
        <div class="control-group">
          <label>旅人 X 軸位置 <span class="val" id="valFigX">0.080</span></label>
          <input type="range" id="rngFigX" min="0.01" max="0.5" step="0.005" value="0.080">
        </div>
        <div class="control-group">
          <label>旅人 Y 軸錨點 <span class="val" id="valFigY">0.900</span></label>
          <input type="range" id="rngFigY" min="0.7" max="1.0" step="0.005" value="0.900">
        </div>
        <div class="control-group">
          <label>旅人 尺寸比例 <span class="val" id="valFigScale">0.38</span></label>
          <input type="range" id="rngFigScale" min="0.25" max="0.55" step="0.01" value="0.38">
        </div>
      </div>

      <div class="toggles-and-actions">
        <label class="checkbox-label">
          <input type="checkbox" id="chkGuide">
          顯示輔助參考線與準星
        </label>

        <div class="btn-row">
          <button id="btnCopyCoords" class="primary">複製當前數值</button>
        </div>
      </div>

      <div class="coords-output" id="outputCoords">
        Ground: [W:1.00, H:0.52, Y:0] | Exit: [X:0, Y:0, Scale:1.00, Rot:0°] | Fig: [X:0.080, Y:0.900, S:0.38]
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tarotCanvas');
    const ctx = canvas.getContext('2d');

    const SKY_TINTS = {
      'sky_gold': 'rgba(212, 175, 55, 0.08)',
      'sky_sunset': 'rgba(224, 110, 60, 0.12)',
      'sky_storm': 'rgba(80, 85, 90, 0.15)',
      'sky_night': 'rgba(30, 45, 80, 0.16)'
    };

    const imageCache = {};

    function loadImage(path) {
      if (imageCache[path]) return Promise.resolve(imageCache[path]);
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          imageCache[path] = img;
          resolve(img);
        };
        img.onerror = () => {
          const fallback = path.startsWith('/') ? path.substring(1) : '/' + path;
          const retryImg = new Image();
          retryImg.crossOrigin = 'anonymous';
          retryImg.onload = () => {
            imageCache[path] = retryImg;
            resolve(retryImg);
          };
          retryImg.onerror = () => resolve(null);
          retryImg.src = fallback;
        };
        img.src = path;
      });
    }

    const selSky = document.getElementById('selSky');
    const selGround = document.getElementById('selGround');
    const selExit = document.getElementById('selExit');
    const selFigure = document.getElementById('selFigure');

    const rngExitX = document.getElementById('rngExitX');
    const rngExitY = document.getElementById('rngExitY');
    const rngExitScale = document.getElementById('rngExitScale');
    const rngExitRot = document.getElementById('rngExitRot');

    const rngGroundW = document.getElementById('rngGroundW');
    const rngGroundH = document.getElementById('rngGroundH');
    const rngGroundY = document.getElementById('rngGroundY');

    const rngFigX = document.getElementById('rngFigX');
    const rngFigY = document.getElementById('rngFigY');
    const rngFigScale = document.getElementById('rngFigScale');

    const valExitX = document.getElementById('valExitX');
    const valExitY = document.getElementById('valExitY');
    const valExitScale = document.getElementById('valExitScale');
    const valExitRot = document.getElementById('valExitRot');

    const valGroundW = document.getElementById('valGroundW');
    const valGroundH = document.getElementById('valGroundH');
    const valGroundY = document.getElementById('valGroundY');

    const valFigX = document.getElementById('valFigX');
    const valFigY = document.getElementById('valFigY');
    const valFigScale = document.getElementById('valFigScale');

    const chkGuide = document.getElementById('chkGuide');
    const outputCoords = document.getElementById('outputCoords');
    const btnCopyCoords = document.getElementById('btnCopyCoords');

    function updateLabels() {
      valExitX.textContent = `${rngExitX.value}px`;
      valExitY.textContent = `${rngExitY.value}px`;
      valExitScale.textContent = `${parseFloat(rngExitScale.value).toFixed(2)}x`;
      valExitRot.textContent = `${rngExitRot.value}°`;

      valGroundW.textContent = parseFloat(rngGroundW.value).toFixed(2);
      valGroundH.textContent = parseFloat(rngGroundH.value).toFixed(2);
      valGroundY.textContent = `${rngGroundY.value}px`;

      valFigX.textContent = parseFloat(rngFigX.value).toFixed(3);
      valFigY.textContent = parseFloat(rngFigY.value).toFixed(3);
      valFigScale.textContent = parseFloat(rngFigScale.value).toFixed(2);

      outputCoords.textContent = 
        `Ground: [W:${valGroundW.textContent}, H:${valGroundH.textContent}, Y:${rngGroundY.value}] | ` +
        `Exit: [X:${rngExitX.value}, Y:${rngExitY.value}, Scale:${valExitScale.textContent.replace('x','')}, Rot:${rngExitRot.value}°] | ` +
        `Fig: [X:${valFigX.textContent}, Y:${valFigY.textContent}, S:${valFigScale.textContent}]`;
    }

    async function liveRender() {
      const sky = selSky.value;
      const ground = selGround.value;
      const exit = selExit.value;
      const figure = selFigure.value;

      const exitX = parseFloat(rngExitX.value);
      const exitY = parseFloat(rngExitY.value);
      const exitScale = parseFloat(rngExitScale.value);
      const exitRot = parseFloat(rngExitRot.value);

      const gW = parseFloat(rngGroundW.value);
      const gH = parseFloat(rngGroundH.value);
      const gYOffset = parseFloat(rngGroundY.value);

      const figX = parseFloat(rngFigX.value);
      const figY = parseFloat(rngFigY.value);
      const figScale = parseFloat(rngFigScale.value);

      // 直接載入原圖，絕無任何破壞性演算法
      const [imgSky, imgExit, imgGround, imgFigure] = await Promise.all([
        loadImage(`/assets/skies/${sky}.png`),
        loadImage(`/assets/exits/${exit}.png`),
        loadImage(`/assets/grounds/${ground}.png`),
        loadImage(`/assets/figures/${figure}.png`)
      ]);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e8e0cc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const margin = 28;
      const innerW = canvas.width - margin * 2;
      const innerH = canvas.height - margin * 2;

      ctx.save();
      ctx.beginPath();
      ctx.rect(margin, margin, innerW, innerH);
      ctx.clip(); // 鎖定在卡面內框

      // 1. 天空
      if (imgSky) {
        ctx.save();
        if (sky === 'sky_night') {
          ctx.translate(margin + innerW, margin);
          ctx.scale(-1, 1);
          ctx.drawImage(imgSky, 0, 0, innerW, innerH);
        } else {
          ctx.drawImage(imgSky, margin, margin, innerW, innerH);
        }
        ctx.restore();
      }

      // 2. 出口（退後）
      if (imgExit) {
        ctx.save();
        const anchorX = margin + innerW * 0.80;
        const anchorY = margin + innerH * 0.75;

        ctx.translate(anchorX + exitX, anchorY + exitY);
        ctx.rotate((exitRot * Math.PI) / 180);
        ctx.scale(exitScale, exitScale);
        ctx.translate(-anchorX, -anchorY);

        ctx.drawImage(imgExit, margin, margin, innerW, innerH);
        ctx.restore();
      }

      // 3. 地貌前景（錨定底框，+3px 壓死底邊避免任何隙縫，再加上手動 Y 位移）
      if (imgGround) {
        ctx.save();
        const groundDrawW = innerW * gW;
        const groundDrawH = innerH * gH;
        const groundDrawY = (margin + innerH) - groundDrawH + 3 + gYOffset;
        ctx.drawImage(imgGround, margin, groundDrawY, groundDrawW, groundDrawH);
        ctx.restore();
      }

      // 4. 古典環境天光浸染 (Multiply)
      if (SKY_TINTS && SKY_TINTS[sky]) {
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = SKY_TINTS[sky];
        ctx.fillRect(margin, margin, innerW, innerH);
        ctx.restore();
      }

      // 5. 旅人姿態
      if (imgFigure) {
        ctx.save();
        const figH_px = innerH * figScale;
        const figAspect = (imgFigure.naturalWidth / imgFigure.naturalHeight) || 0.6;
        const figW_px = figH_px * figAspect;
        const figPosX = margin + innerW * figX;
        const figPosY = margin + innerH * figY - figH_px;
        ctx.drawImage(imgFigure, figPosX, figPosY, figW_px, figH_px);
        ctx.restore();
      }

      ctx.restore();

      // 6. 1909 偉特雙黑框
      ctx.save();
      ctx.strokeStyle = '#2b261f';
      ctx.lineWidth = 4;
      ctx.strokeRect(margin, margin, innerW, innerH);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(margin - 8, margin - 8, innerW + 16, innerH + 16);
      ctx.restore();

      // 7. 輔助線與準星 (勾選時顯示)
      if (chkGuide.checked) {
        ctx.save();
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);

        ctx.strokeStyle = 'rgba(78, 205, 196, 0.7)';
        ctx.beginPath();
        ctx.moveTo(margin, canvas.height / 2);
        ctx.lineTo(margin + innerW, canvas.height / 2);
        ctx.moveTo(canvas.width / 2, margin);
        ctx.lineTo(canvas.width / 2, margin + innerH);
        ctx.stroke();

        const curExitAnchorX = margin + innerW * 0.80 + exitX;
        const curExitAnchorY = margin + innerH * 0.75 + exitY;
        ctx.strokeStyle = 'rgba(255, 68, 68, 0.9)';
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(curExitAnchorX, curExitAnchorY, 6, 0, Math.PI * 2);
        ctx.moveTo(curExitAnchorX - 16, curExitAnchorY);
        ctx.lineTo(curExitAnchorX + 16, curExitAnchorY);
        ctx.moveTo(curExitAnchorX, curExitAnchorY - 16);
        ctx.lineTo(curExitAnchorX, curExitAnchorY + 16);
        ctx.stroke();

        ctx.restore();
      }
    }

    [selSky, selGround, selExit, selFigure].forEach(el => {
      el.addEventListener('change', liveRender);
    });

    chkGuide.addEventListener('change', liveRender);

    [rngExitX, rngExitY, rngExitScale, rngExitRot, rngGroundW, rngGroundH, rngGroundY, rngFigX, rngFigY, rngFigScale].forEach(slider => {
      slider.addEventListener('input', () => {
        updateLabels();
        liveRender();
      });
    });

    btnCopyCoords.addEventListener('click', () => {
      navigator.clipboard.writeText(outputCoords.textContent).then(() => {
        const orig = btnCopyCoords.textContent;
        btnCopyCoords.textContent = '已複製！';
        setTimeout(() => btnCopyCoords.textContent = orig, 1500);
      });
    });

    updateLabels();
    liveRender();
  </script>
</body>
</html>
